		# Range: 1.0 ~ 100000.0
		maxHealth = 120.0
		#爆炸减伤比例；0 为不减伤，1 为免疫爆炸。 / Explosion resistance: 0 = none, 1 = immune.
		# Default: 0.5
		# Range: 0.0 ~ 1.0
		explosionResistance = 0.5
		#工作时限，20 tick = 1 秒；-1 使用全局 sentryLifetimeTicks，0 不按时间回收；人员操作型炮位忽略此项。 / Lifetime: -1 = global, 0 = unlimited; ignored by manned emplacements.
		# Default: -1
		# Range: -1 ~ 240000
		lifetimeTicks = -1
		#每发直击伤害；火焰为每次射流、激光为每次结算、电塔为每次放电对每个目标的伤害，不含持续燃烧。 / Direct damage per shot/pulse, excluding burning.
		# Default: 8.0
		# Range: 0.0 ~ 100000.0
		damage = 8.0
