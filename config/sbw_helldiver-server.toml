#信标显示的呼叫倒计时，实际撞地在归零后 20 tick（1 秒）；20 tick = 1 秒。
#空投仓出现后固定下落 95 tick（4.75 秒）；默认仍显示四秒倒计时，归零后一秒撞地。
# Default: 80
# Range: 0 ~ 1200
dropDelayTicks = 80
#舱体底面在落点上方的生成高度（格）。
#战备信标的计时空投至少使用 720 格，旧存档的低值也会采用此下限。
# Default: 720
# Range: 16 ~ 2048
spawnHeight = 720
#旧版本速度选项，保留供兼容；新版所有空投仓统一采用 4.75 秒下落路径。
# Default: 2.0
# Range: 0.1 ~ 20.0
fallSpeed = 2.0
#距离最终落点多少格开始喷射减速，三块外板在此阶段打开。
#战备信标的计时空投至少在 336 格开始制动；喷射制动约 2.2 秒。
# Default: 336.0
# Range: 2.0 ~ 2048.0
brakeHeight = 336.0
#钻头尖端埋入地面的深度（格）；新版模型原点到尖端为 5.5456 格。
#默认 5.45 留下约 0.10 格顶沿；设为 0 可检查完整舱体。
#旧版默认 5.3 / 5.37 会按新版模型校准到 5.45。
#不改变地形方块；开仓后的内部通过舱口局部深度渲染显示。
# Default: 5.45
# Range: 0.0 ~ 6.5
burialDepth = 5.45
#战备弹药耗尽或工作时限到达后是否自动缩回空投仓；不影响被摧毁的效果或玩家投送出仓。
#Automatically retract deployed stratagems when ammunition or operating time runs out.
autoRetract = true
#炮台与人员操作型炮位不消耗弹药或燃料；火箭仍需装填，激光过热与工作时限不受影响。
#Unlimited turret ammunition/fuel. Rocket reloads, laser heat and autonomous sentry lifetimes still apply.
infiniteTurretAmmo = false
#独立控制战备爆炸是否破坏方块，不受 SBW 爆炸总开关影响；关闭后保留生物伤害、击退、音效与粒子。不改变本来不破坏地形的战备。
#Independently allow terrain-damaging stratagem explosions to destroy blocks, regardless of the SBW global setting. Disabling this preserves entity damage, knockback, sounds and particles.
stratagemExplosionBlockDamage = false
#工作时限（tick），默认 150 秒；0 表示只按弹药耗尽回收。
# Default: 3000
# Range: 0 ~ 240000
sentryLifetimeTicks = 3000
#弹出的独立盖板落地后保留多久（tick），默认 600 = 30 秒。
# Default: 600
# Range: 20 ~ 12000
capLifetimeTicks = 600
#兼容旧存档的选项；当前炮台始终不对玩家索敌，但子弹和爆炸可以误伤玩家。
attackPlayers = false
#是否攻击其他 Mob。默认只攻击 Enemy；始终排除已驯服宠物。
attackNeutralMobs = false

