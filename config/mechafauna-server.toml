#机械生物设置
[flying_saucer_boss]
	#飞碟母舰最大生命值。
	#四个独立武器部件的血量各继承本体的 80/300。
	#本体 300 时每个部件 80；改为 700 时每个部件约为 186.67。
	# Default: 300
	# Range: 1 ~ 1000000
	maxHealth = 300
	#基础攻击力。新技能伤害 = 基础攻击力 × 技能倍率。
	# Default: 10.0
	# Range: 0.0 ~ 10000.0
	attackDamage = 10.0
	#残骸暴走：每摧毁一个武器部件，技能与下射激光冷却缩短的比例。
	#0.15 = 每个部件 -15%，四个全毁时冷却为原来的 40%（最低不低于 40%）。
	# Default: 0.15
	# Range: 0.0 ~ 0.25
	cooldownReductionPerDestroyedWeapon = 0.15
	#两次特殊技能之间的最短间隔（tick），同样受残骸暴走缩短。
	# Default: 80
	# Range: 0 ~ 72000
	skillIntervalTicks = 80

	[flying_saucer_boss.percent_damage]
		#是否启用百分比伤害：飞碟的所有攻击命中非玩家生物时，额外造成目标最大生命值百分比的伤害。
		#每次命中的百分比 = 该次攻击倍率 × percentPerMultiplier，攻击倍率 = 该次伤害 ÷ 飞碟基础攻击力。
		enabled = true
		#每 1.0 攻击倍率对应的最大生命值百分比（0.04 = 4%）。
		# Default: 0.04
		# Range: 0.0 ~ 1.0
		percentPerMultiplier = 0.04

	[flying_saucer_boss.gravity_well]
		#是否启用引力奇点：向目标投下奇点，持续牵引周围单位后坍缩爆发。
		enabled = true
		#坍缩爆发伤害倍率，奇点核心的持续伤害为其 10%。
		# Default: 1.8
		# Range: 0.0 ~ 100.0
		damageMultiplier = 1.8
		#冷却时间（tick）。
		# Default: 360
		# Range: 20 ~ 72000
		cooldownTicks = 360

	[flying_saucer_boss.halo_sweep]
		#是否启用光环扫射：悬停后从舰体边缘射出六道旋转光束，螺旋向外扫过地面。
		enabled = true
		#每次被光束扫中的伤害倍率。
		# Default: 0.6
		# Range: 0.0 ~ 100.0
		damageMultiplier = 0.6
		#冷却时间（tick）。
		# Default: 320
		# Range: 20 ~ 72000
		cooldownTicks = 320

	[flying_saucer_boss.plasma_rain]
		#是否启用等离子暴雨：连续标记落点，等离子弹从天而降，部分落点预判目标走位。
		enabled = true
		#每发等离子弹的伤害倍率。
		# Default: 1.0
		# Range: 0.0 ~ 100.0
		damageMultiplier = 1.0
		#冷却时间（tick）。
		# Default: 280
		# Range: 20 ~ 72000
		cooldownTicks = 280

#重装机甲（精英）设置。新技能伤害 = 基础攻击力 × 技能倍率。
[heavy_mech]
	#最大生命值，仅对新生成的机甲生效。
	# Default: 180.0
	# Range: 1.0 ~ 1000000.0
	maxHealth = 180.0
	#基础攻击力。
	# Default: 8.0
	# Range: 0.0 ~ 10000.0
	attackDamage = 8.0

	[heavy_mech.orbital_barrage]
		#是否启用轨道导弹齐射：向天发射导弹，在目标周围标记警示圈后集中轰炸。
		enabled = true
		#每枚落弹的伤害倍率。
		# Default: 1.5
		# Range: 0.0 ~ 100.0
		damageMultiplier = 1.5
		#冷却时间（tick）。
		# Default: 260
		# Range: 20 ~ 72000
		cooldownTicks = 260

	[heavy_mech.rocket_charge]
		#是否启用火箭冲撞：蓄力后沿地面警示线高速冲刺。
		enabled = true
		#冲撞伤害倍率，撞墙震波为其 60%。
		# Default: 1.4
		# Range: 0.0 ~ 100.0
		damageMultiplier = 1.4
		#冷却时间（tick）。
		# Default: 200
		# Range: 20 ~ 72000
		cooldownTicks = 200

	[heavy_mech.overload]
		#是否启用核心过载阶段：血量降到阈值时释放 EMP 冲击波并进入过载状态。
		enabled = true
		#触发阈值，按最大生命值百分比计算（0.5 = 半血）。
		# Default: 0.5
		# Range: 0.0 ~ 1.0
		healthRatio = 0.5
		#EMP 冲击波伤害倍率。
		# Default: 1.2
		# Range: 0.0 ~ 100.0
		pulseDamageMultiplier = 1.2
		#过载状态持续时间（tick），期间移速提升、技能冷却缩短。
		# Default: 400
		# Range: 20 ~ 72000
		durationTicks = 400

#机械坦克（精英）设置。新技能伤害 = 基础攻击力 × 技能倍率。
[mechanical_tank]
	#最大生命值，仅对新生成的坦克生效。
	# Default: 105.0
	# Range: 1.0 ~ 1000000.0
	maxHealth = 105.0
	#基础攻击力。
	# Default: 6.0
	# Range: 0.0 ~ 10000.0
	attackDamage = 6.0

	[mechanical_tank.railgun]
		#是否启用电磁轨道炮：蓄能并用激光锁定后发射贯穿光束。
		enabled = true
		#贯穿光束伤害倍率。
		# Default: 2.4
		# Range: 0.0 ~ 100.0
		damageMultiplier = 2.4
		#冷却时间（tick）。
		# Default: 220
		# Range: 20 ~ 72000
		cooldownTicks = 220

	[mechanical_tank.cluster_mortar]
		#是否启用集束迫击炮：高抛子母弹，在目标周围连环落弹。
		enabled = true
		#每枚子弹的伤害倍率。
		# Default: 1.3
		# Range: 0.0 ~ 100.0
		damageMultiplier = 1.3
		#冷却时间（tick）。
		# Default: 240
		# Range: 20 ~ 72000
		cooldownTicks = 240

	[mechanical_tank.aegis_shield]
		#是否启用能量护盾阶段：血量降到阈值时展开护盾，结束时爆裂产生冲击波。
		enabled = true
		#第一次展开阈值，按最大生命值百分比计算。
		# Default: 0.5
		# Range: 0.0 ~ 1.0
		firstHealthRatio = 0.5
		#第二次展开阈值，按最大生命值百分比计算，设为 0 关闭第二次。
		# Default: 0.25
		# Range: 0.0 ~ 1.0
		secondHealthRatio = 0.25
		#护盾持续时间（tick）。
		# Default: 160
		# Range: 20 ~ 72000
		durationTicks = 160
		#护盾期间的减伤比例（0.6 = 减免 60%）。
		# Default: 0.6
		# Range: 0.0 ~ 1.0
		damageReduction = 0.6
		#护盾爆裂冲击波伤害倍率。
		# Default: 1.0
		# Range: 0.0 ~ 100.0
		burstDamageMultiplier = 1.0
