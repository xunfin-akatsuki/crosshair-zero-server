# Boss Bars (also in game: Mods > Boss Bars > Config)
# how the bars of bosses from other mods look:
#   themes: every boss bar gets a Boss Bars frame (ice, fire, nature...)
#   own_animated: each boss keeps its own mod's bar, with the Boss Bars animations over it
#   own: each boss keeps its own mod's bar, untouched
modded_bosses=themes
