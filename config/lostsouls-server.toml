#Personal ordered boss kills unlock Lost Cities ONLY in twilightforest:twilight_forest.
#Does not generate cities, change native Twilight progression, or affect the overworld.
[twilightCityProgression]
	enabled = true
	#Spectators always bypass; creative players bypass only when enabled.
	creativeBypass = true
	#Share of Twilight ordinary mobs/elite mobs in themed cities.
	#The remaining share uses the original overworld building pools, equipment and integrations.
	# Default: 0.3
	# Range: 0.0 ~ 1.0
	twilightMobShare = 0.3
	#Fallback city rank: 1 + floor(city center distance from dimension origin / this value), capped at 8.
	#For continuous/perlin cities without a center the fallback is rank 1. Use cityStyleRanks for explicit tiers.
	# Default: 2048
	# Range: 256 ~ 1000000
	blocksPerRank = 2048
	#Exact citystyle ID=rank overrides, e.g. lostsouls:twilight_tier_1=1.
	#Ranks 1..8 require Naga, Lich, Minoshroom, Hydra, all Knight Phantoms, Ur-Ghast, Alpha Yeti, Snow Queen IN ORDER.
	#A style override uses the city CENTER style, not a neighboring building style.
	cityStyleRanks = ["lostsouls:twilight_tier_1=1", "lostsouls:twilight_tier_2=2", "lostsouls:twilight_tier_3=3", "lostsouls:twilight_tier_4=4", "lostsouls:twilight_tier_5=5", "lostsouls:twilight_tier_6=6", "lostsouls:twilight_tier_7=7", "lostsouls:twilight_tier_8=8"]
