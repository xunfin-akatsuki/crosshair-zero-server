	randomEffects = [".05=minecraft:speed,1", ".04=minecraft:regeneration,1", ".03=minecraft:fire_resistance,1", ".02=minecraft:strength,1", ".02=minecraft:resistance,1", ".01=minecraft:invisibility,1"]
	#List of console commands to execute the first time a building is entered
	commandFirstTime = []
	#List of console commands to execute every time a building is entered
	commandEntered = []
	#List of console commands to execute when a building is cleared
	commandCleared = []
	#The delay (in ticks) before a new 'haunted' message is given to the player
	# Default: 12000
	# Range: 1 ~ 1000000
	messageInterval = 12000
	#The amount of ticks that the server waits before checking for new spawns
	# Default: 200
	# Range: 1 ~ 1000000
	serverTickTimeout = 80
	#If this is true, the horde building spawning max amount will be based on the total mob required to kill, and it won't use SPAWN_MAX_NEARBY/RADIUS at all.
	useChunkCheck = false
	#If this is true then mobs will only spawn if the light level is low enough. Otherwise they spawn regardless of light level
	checkValidSpawn = false
	#If this is true then mobs will only spawn on blocks but not on air
	spawnOnBlock = false
	#Minimum chance for NEW buildings after global, sphere, multibuilding and datapack settings are combined.
	#Explicit zero chances and excludedBuildings remain safe. Set to 0 to respect lower datapack chances.
	#Existing saved buildings are never rerolled.
	# Default: 0.95
	# Range: 0.0 ~ 1.0
	minimumHauntedChance = 0.95
	#Enable independent haunting and game-time renewal for the six supported wilderness structure packs.
	#Shares city spawn budgets; does not add bosses, edit templates or change vehicle inventories.
	hauntWildernessStructures = true
	#Highest danger level a scattered wilderness structure may reach.
	#1 keeps every cabin, ship, ruin and factory at the same starter difficulty;
	#raise it only if you want distance/type bonuses there again.
	# Default: 1
	# Range: 1 ~ 10
	wildernessMaxLevel = 1
	#Hard cap on how many monsters one wilderness structure asks for at once.
	#Applies on top of the volume formula, so it is safe to keep in single digits.
	# Default: 8
	# Range: 1 ~ 32
	wildernessMaxMobs = 8

#Building difficulty. Assigned levels and names are saved per building.
[difficulty]
	enabled = true
	useSpawnDistance = true
	useBuildingType = true
	#One extra level per this many horizontal blocks from world spawn; dimension coordinate scale is applied.
	# Default: 1500
	# Range: 1 ~ 30000000
	blocksPerLevel = 1500
	# Default: 10
	# Range: 1 ~ 10
	maxLevel = 10
	#Horizontal building-center distance from overworld spawn, inclusive; dimension coordinate scale is applied.
	#0 disables this cap. Independent of useSpawnDistance. Also lowers saved levels on access without resetting progress.
	# Default: 1000
	# Range: 0 ~ 30000000
	spawnProtectionRadius = 1000
	#Maximum building level within spawnProtectionRadius. Never raises a lower level.
	# Default: 2
	# Range: 1 ~ 10
	spawnProtectionMaxLevel = 2
	#Safety cap on the total quota of NEW buildings after difficulty scaling.
	# Default: 2000
	# Range: 1 ~ 100000
	maxTotalMobs = 2000
	#Maximum horizontal position attempts per desired mob, per building wave.
	#Vertical candidates resume across ticks under the shared spawnPerformance budget.
	# Default: 24
	# Range: 1 ~ 32
	spawnAttempts = 8
	#First matching rule wins. Format: namespace:building_glob=baseLevel. '*' matches any text.
	#Rules match multibuilding IDs first, then individual building IDs; e.g. chaoszpack_reforged:*hospital*=4.
	buildingOverrides = []
	#Limit building mobs' ZeroContact helmets, armor and plates by tier.maxProtectionLevel.
	#Also caps vanilla armor by building tier. Includes existing marked mobs and delayed loadouts; does not change weapons.
	limitBuildingEquipment = true
	#Require building ownership, floor support, ceiling and enclosing walls. Never falls back to outdoor spawning.
	indoorOnly = true
	# Default: 12
	# Range: 1 ~ 64
	indoorCeilingSearch = 12
	# Default: 32
	# Range: 1 ~ 64
	indoorWallSearch = 32
	#Number of cardinal directions with a two-height wall inside the same building.
	# Default: 3
	# Range: 2 ~ 4
	indoorMinimumWalls = 3
	#Search above and below player height for actual floor surfaces, including slabs.
	# Default: 6
	# Range: 0 ~ 24
	spawnVerticalSearch = 6

