#One persistent elite boss at most per NEW haunted building; no Wither or Dragon by default.
[boss]
	#Disabling cancels unspawned bosses when their building is accessed. Already spawned bosses remain and must still be defeated.
	enabled = true
	#Unspawned boss plans below this level are canceled when their building is accessed.
	# Default: 3
	# Range: 1 ~ 10
	minimumLevel = 3
	# Default: 0.35
	# Range: 0.0 ~ 1.0
	chance = 0.35
	#Fraction of the normal mob quota killed before the boss can spawn.
	# Default: 0.75
	# Range: 0.0 ~ 1.0
	spawnAfterProgress = 0.75
	#Additional multiplier on top of building and tier bonuses.
	# Default: 4.0
	# Range: 0.01 ~ 100.0
	healthMultiplier = 4.0
	# Default: 1.75
	# Range: 0.01 ~ 100.0
	damageMultiplier = 1.75
	# Default: 1.1
	# Range: 0.01 ~ 10.0
	speedMultiplier = 1.1
	glowing = true
	#Weighted mob IDs: weight=namespace:entity. Supports other mods. An empty or invalid pool cancels the boss, not building clearance.
	entities = ["4=minecraft:husk", "2=minecraft:vindicator", "1=minecraft:ravager"]

#Server-authoritative building entry titles. Install LostSouls on both sides; TravelersTitles is optional and client-only.
[buildingTitles]
	enabled = true
	# Default: 10
	# Range: 1 ~ 200
	checkIntervalTicks = 10
	#Per-player, per-building re-entry cooldown, in ticks.
	# Default: 200
	# Range: 0 ~ 72000
	reentryCooldownTicks = 200
	# Default: 10
	# Range: 1 ~ 200
	fadeInTicks = 10
	# Default: 60
	# Range: 1 ~ 1200
	stayTicks = 60
	# Default: 20
	# Range: 1 ~ 200
	fadeOutTicks = 20
	#Use vanilla titles when TravelersTitles is absent or its interface is incompatible.
	vanillaFallback = true

#Integration for Champions Unofficial 21.1.1.7. No hard dependency on Champions.
[championsIntegration]
	#Boss-only promotion. Also blocks random, command and inherited champion creation outside this integration.
	enabled = true
	#Replace only Champions bonus loot, leaving native entity drops intact.
	replaceLoot = true
	#Bonus loot requires a recent player hit, including normal ranged kills.
	requirePlayerKill = true
	#entityId=stars. First match wins; overrides saved stars and distance/building difficulty.
	#Only recognized bosses qualify. Existing bosses are corrected without healing.
	fixedBossStars = ["minecraft:ender_dragon=5", "alexsmobs:void_worm=5", "minecraft:wither=5"]
	#Treat living entities declaring a non-static ServerBossEvent/BossEvent field as bosses.
	detectBossBars = true
	detectBossArsenalMarker = true
	#Explicit boss entity IDs, also supporting bosses without boss bars.
	#The lostsouls:bosses entity-type tag and lostsouls_boss entity tag are also recognized.
	bossEntities = ["minecraft:wither", "minecraft:ender_dragon", "alexsmobs:void_worm", "aquamirae:captain_cornelia", "mca:grim_reaper", "cyber_ware_port:cyber_wither", "undead_revamp2:slaveman", "undead_revamp2:thehorrors", "undead_revamp2:thepregnant", "undead_revamp2:theheavy", "undead_revamp2:clogger", "undead_revamp2:thedungeon"]
	#Deny list wins over all boss recognition, including LostSouls bosses.
	excludedEntities = ["dummmmmmy:target_dummy"]
	#Randomly selected without duplicates. Explicit affixes avoid vanilla bosses without an archetype.
	#Splitting is intentionally omitted; summoned minions must not inherit boss status.
	affixes = ["champions:knocking", "champions:dampening", "champions:hasty", "champions:wounding", "champions:shielding"]

[championTier1]
	#Stars assigned to this building/distance difficulty; defaults are 1:1.
	# Default: 1
	# Range: 1 ~ 5
	stars = 1
	#Guaranteed advance stones for this STAR count. Defaults: 1, 2, 4, 8, 16.
	#Legacy advance_stone entries in loot are ignored to prevent duplicate/random rewards.
	# Default: 1
	# Range: 0 ~ 4096
	advanceStones = 1
	# Default: 1
	# Range: 0 ~ 16
	affixCount = 1
	# Default: 1
	# Range: 1 ~ 10
	affixStrength = 1
	#Reward for this STAR count, not difficulty. itemId,min,max,chance; all entries roll independently.
	#Missing optional items are skipped. Quantities are split into valid stacks. No looting multiplier.
	loot = ["minecraft:diamond,1,2,1.0", "minecraft:emerald,2,4,1.0"]

[championTier2]
	#Stars assigned to this building/distance difficulty; defaults are 1:1.
	# Default: 2
	# Range: 1 ~ 5
	stars = 2
	#Guaranteed advance stones for this STAR count. Defaults: 1, 2, 4, 8, 16.
	#Legacy advance_stone entries in loot are ignored to prevent duplicate/random rewards.
	# Default: 2
	# Range: 0 ~ 4096
	advanceStones = 2
	# Default: 1
	# Range: 0 ~ 16
	affixCount = 1
	# Default: 1
