#Independent indoor residents. Safe and cleared buildings also qualify.
#Quota and spawned count are saved per whole building; residents are never replenished.
[buildingNeutrals]
	enabled = true
	#Lifetime cap per building, shared by all players and floors.
	# Default: 3
	# Range: 0 ~ 16
	maxPerBuilding = 3
	#One-time population chance for levels 1 through 5; exactly five numbers.
	#Rolled only when eligible entities exist. Failed indoor placement does not consume quota.
	chancesByLevel = [0.7, 0.55, 0.35, 0.2, 0.1]
	#Same entry format as buildingMonsters. MCA genders are real entity IDs, not professions.
	#Vanilla villagers are a fallback when MCA villagers are unavailable in the eligible pool.
	#Monsters, Enemy implementations and recognized bosses are rejected. No combat enhancements or clear credit.
	entries = ["1,5,5,*,mca:male_villager", "1,5,5,*,mca:female_villager", "1,5,5,*,minecraft:villager", "1,3,1,*,minecraft:cat"]

#Global server-thread budget shared by all building enemies, bosses and residents.
#Unfinished searches resume on later ticks. No async world access or outdoor fallback.
[spawnPerformance]
	#Global work steps per tick. Each step tests at most one vertical placement candidate, or prepares one target.
	# Default: 8
	# Range: 1 ~ 128
	maxStepsPerTick = 8
	#Global successful entity additions per tick, including bosses and residents.
	# Default: 2
	# Range: 1 ~ 32
	maxSpawnsPerTick = 2
	#Soft elapsed-time budget checked between steps. A mod constructor/finalizeSpawn cannot be preempted.
	# Default: 2.0
	# Range: 0.1 ~ 20.0
	maxMillisPerTick = 2.0
	#Duplicate waves for an already queued building are not accumulated.
	# Default: 128
	# Range: 1 ~ 4096
	maxQueuedBuildings = 128
	#Cancel unfinished work after this many server ticks; no catch-up burst. Saves are unaffected.
	# Default: 1200
	# Range: 20 ~ 24000
	maxJobAgeTicks = 1200
	#Minimum retry delay after a completed wave tried positions without success; doubles on repeated failures.
	#Timeouts and player departure do not increase backoff.
	# Default: 80
	# Range: 1 ~ 12000
	failedSearchDelayTicks = 80
	#Maximum backoff, never less than failedSearchDelayTicks. Successful spawns reset it.
	# Default: 400
	# Range: 1 ~ 24000
	maxFailedSearchDelayTicks = 400

#Cleared haunted buildings become haunted again after server game ticks.
#Sleeping, /time and server downtime do not advance this clock. No block reconstruction.
[buildingRenewal]
	enabled = true
	showCountdown = true
	#Base interval; 24000 ticks is one Minecraft day.
	# Default: 24000
	# Range: 20 ~ 172800000
	baseTicks = 24000
	# Default: 24000
	# Range: 20 ~ 172800000
	minimumTicks = 24000
	# Default: 336000
	# Range: 20 ~ 172800000
	maximumTicks = 336000
	#Reference volume in blocks: one 16x16x6 inhabited floor.
	#Delay = base * cubeRoot(volume/referenceVolume) * (1 + distance/distanceScale), clamped to limits.
	# Default: 1536.0
	# Range: 1.0 ~ 1.0E9
	referenceVolume = 1536.0
	#Horizontal overworld-equivalent distance from world spawn; not player beds.
	# Default: 3000.0
	# Range: 1.0 ~ 3.0E7
	distanceScale = 3000.0

