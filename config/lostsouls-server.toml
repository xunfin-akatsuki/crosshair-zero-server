#General settings
[general]
	#If this is true then all chests will be locked until the building is cleared
	lockChestsUntilCleared = false
	#This option is only useful when 'lockChestsUntilCleared'. If true only vanilla chests will be locked. Otherwise all tile entities are locked
	lockOnlyChests = true
	#This message is given when the player tries to open a chest in a haunted building
	messageUnsafeBuilding = "§c这里不安全……有什么东西在动。"
	#This message is given when the player enters a haunted building for the first time
	messageBuildingHaunted = "§c这栋建筑里有东西。它们还在这里。"
	#This message is given when the player enters a haunted building after at least 'messageInterval' ticks have passed. Use <same> to have the same message as the first time
	messageBuildingHauntedRepeat = "§7它们还没走。"
	#This message is given when the player clears a building
	messageBuildingCleared = "§a建筑已清理。可以搜刮了。"
	#This message is given when the player is halfway clearing a building
	messageBuildingHalfway = "§e还剩一些……"
	#If this is true then the player will be notified when a building is cleared
	announceCleared = true
	#If this is true then the player will be notified when he or she enters a haunted building
	announceEnter = true
	#If this is true then the player will get a message when he/she tries to open a locked chest
	announceChestLocked = true
	#The chance that a building is haunted
	# Default: 0.95
	# Range: 0.0 ~ 1.0
	hauntedChance = 0.85
	#Makes 'hauntedChance' relative to the number of chunks in a multibuilding. 0 means that it is the same. 1 means that it multiplies by the number of chunks in the building
	# Default: 0.30000001192092896
	# Range: 0.0 ~ 100.0
	hauntedChanceMultiplier = 0.8
	#The minimum amount of mobs that are spawned by a haunted building
	# Default: 10
	# Range: 1 ~ 10000
	minMobs = 10
	#The maximum amount of mobs that are spawned by a haunted building
	# Default: 50
	# Range: 1 ~ 10000
	maxMobs = 30
	#Makes 'minMobs' relative to the number of chunks in a multibuilding. 0 means that it is the same. 1 means that it multiplies by the number of chunks in the building
	# Default: 0.30000001192092896
	# Range: 0.0 ~ 100.0
	minMobsMultiplier = 0.8
	#Makes 'maxMobs' relative to the number of chunks in a multibuilding. 0 means that it is the same. 1 means that it multiplies by the number of chunks in the building
	# Default: 0.30000001192092896
	# Range: 0.0 ~ 100.0
	maxMobsMultiplier = 1.0
	#The chance that a building is haunted. This version is used in case the building is in a Lost City sphere
	# Default: 0.95
	# Range: 0.0 ~ 1.0
	sphereHauntedChance = 0.15
	#The minimum amount of mobs that are spawned by a haunted building. This version is used in case the building is in a Lost City sphere
	# Default: 10
	# Range: 1 ~ 10000
	sphereMinMobs = 1
	#The maximum amount of mobs that are spawned by a haunted building. This version is used in case the building is in a Lost City sphere
	# Default: 50
	# Range: 1 ~ 10000
	sphereMaxMobs = 3
	#The minimum health bonus that the mob will get
	# Default: 2.0
	# Range: 0.009999999776482582 ~ 10000.0
	minHealthBonus = 1.0
	#The maximum health bonus that the mob will get
	# Default: 5.0
	# Range: 0.009999999776482582 ~ 10000.0
	maxHealthBonus = 4.0
	#The minimum damage bonus that the mob will get
	# Default: 2.0
	# Range: 0.009999999776482582 ~ 10000.0
	minDamageBonus = 0.009999999776482582
	#The maximum damage bonus that the mob will get
	# Default: 5.0
	# Range: 0.009999999776482582 ~ 10000.0
	maxDamageBonus = 2.0
	#The maximum amount of entities that can spawn near each other (of the same type)
	# Default: 6
	# Range: 1 ~ 200
	spawnMaxNearby = 16
	#The radius for checking maximum amount of entities can spawn in an area.
	# Default: 8
	# Range: 1 ~ 128
	spawnMaxNearbyRadius = 6.0
	#The minimum distance between the player and newly spawned mobs
	# Default: 8.0
	# Range: 0.0 ~ 128.0
	minSpawnDistance = 3.0
	#The maximum distance between the player and newly spawned mobs
	# Default: 16.0
	# Range: 0.0 ~ 128.0
	maxSpawnDistance = 12.0
	#A list of buildings that are safe(r)
	excludedBuildings = []
	#List of mobs that can spawn in buildings together with their rarity
	mobs = [".24=minecraft:zombie", ".10=minecraft:husk", ".07=minecraft:drowned", ".05=minecraft:zombie_villager", ".05=minecraft:skeleton", ".04=minecraft:spider", ".03=minecraft:cave_spider", ".02=minecraft:stray", ".02=minecraft:creeper", ".01=minecraft:witch", ".01=minecraft:enderman", ".06=undeadnights:horde_zombie", ".03=undeadnights:elite_zombie", ".015=undeadnights:demolition_zombie", ".05=mutantszombies:crawler", ".03=mutantszombies:blister_zombie", ".03=mutantszombies:spitter", ".02=mutantszombies:split_head_zombie", ".015=mutantszombies:rotten_mutant", ".012=mutantszombies:zombie_brute", ".004=mutantszombies:mutant_brute", ".004=mutantmonsters:mutant_zombie", ".03=zoniex:tormented_zombie", ".02=zoniex:skin_crawler", ".004=zoniex:disemboweler", ".004=zoniex:spine_wrencher", ".04=cyber_ware_port:cyber_zombie", ".015=cyber_ware_port:cyber_skeleton", ".008=cyber_ware_port:cyber_creeper", ".03=mca:male_zombie_villager", ".03=mca:female_zombie_villager", ".02=tide:cave_crawler", ".01=tacz_bandits:bandit", ".01=alexsmobs:murmur", ".01=alexsmobs:skreecher", ".005=cave_dweller:cave_dweller", ".01=minecraft:villager", ".05=outbreak_kf:cyst", ".04=outbreak_kf:alpha_clot", ".03=outbreak_kf:gorefiend", ".025=outbreak_kf:crawler", ".02=outbreak_kf:stalker", ".015=outbreak_kf:bloat", ".012=outbreak_kf:husk", ".01=outbreak_kf:siren", ".008=outbreak_kf:spitter", ".004=outbreak_kf:scrake", ".003=outbreak_kf:fleshpound"]
	#List of weapons that the mobs can have together with their rarity
	randomWeapons = [".18=null", ".06=minecraft:wooden_sword", ".08=minecraft:stone_sword", ".06=minecraft:golden_sword", ".09=minecraft:iron_sword", ".05=minecraft:iron_axe", ".03=minecraft:diamond_sword", ".08=minecraft:bow", ".05=minecraft:crossbow", ".02=minecraft:trident", ".05=farmersdelight:flint_knife", ".05=farmersdelight:iron_knife", ".03=butchery:copper_cleaver", ".02=butchery:iron_cleaver", ".02=butchery:bone_hammer", ".03=superbwarfare:knife", ".02=superbwarfare:hammer", ".03=caverns_and_chasms:copper_sword", ".02=caverns_and_chasms:silver_sword"]
	#List of helmets that the mobs can have together with their rarity
