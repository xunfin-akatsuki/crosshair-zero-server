			# Default: 60
			# Range: 2 ~ 1200
			lifetime = 60
			#地面扬尘的颜色，0xRRGGBB（0..0xFFFFFF）。只有 tintFromBlock 关掉时才看它；开着时用被找到的地面方块自己的颜色。
			# Default: 16777215
