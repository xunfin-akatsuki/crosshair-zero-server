			#中炮炮口烟的初始透明度倍率（0.05~1.0，默认 0.6）。这就是「别一炮糊得啥都看不到」的那个旋钮：1.0 等于 CBC 原样，越小越透。
			# Default: 0.6
			# Range: 0.05 ~ 1.0
			initial = 0.6
			#炮口烟从寿命的百分之几开始变淡（0~1，默认 0.35）。它靠【透明度】散掉，所以这一项决定「什么时候开始消失」；CBC 那条色带的灰色段在很后面，默认值会在走到灰色之前就把它淡掉。
			# Default: 0.35
			# Range: 0.0 ~ 1.0
			fadeFrom = 0.35
			#变淡的速率（每 tick 减去初始倍率的多少，0.1~10，默认 1.5）。1/fadeRate 就是淡完所需 tick 数的量级：默认 1.5 ≈ 0.67 秒淡完。
			# Default: 1.5
