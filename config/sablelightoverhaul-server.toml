			#让地面扬尘取它落到的那块方块的颜色。关掉就用上面 groundDust.color 的固定色。
			tintFromBlock = false
			#每个落点上，地面扬尘撒在多大的半径内，单位格（0..16）。撒得开一点才读得出“地面被掀起”，而不是一个点。
			# Default: 2.5
