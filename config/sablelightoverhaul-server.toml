		[muzzle.tankCannon.recoil]
			#开炮时把承载炮的物理载具往后推：方向从炮口出发、与炮弹相反。载具取碰撞链里最大的那个碰撞箱；不属于物理载具的炮会被直接跳过（不报错，就是不推）。需要 Sable 的物理载具。
			enabled = true
			#每一次物理步施加的速度变化，单位格/tick（0..5）。一发炮弹给的总量是这个数乘 physicsSteps。上限故意留得很大：大炮允许把自己的车推飞。
			# Default: 0.5
			# Range: 0.0 ~ 5.0
			velocity = 0.5
			#一次后坐力分几步施加（1..40）。分步是照推进器的方式做的：每步只给一点，才不会在船自己的稳定器里还没积分就被吃掉。
			# Default: 20
			# Range: 1 ~ 40
			physicsSteps = 20

