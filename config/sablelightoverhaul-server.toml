			damping = 0.75
			#地面扬尘的下沉加速度，单位格/tick²（0..4）。竖直方向只有重力，没有任何向上的力。只对本模组自己的 ground_dust 粒子有效。
			# Default: 0.06
			# Range: 0.0 ~ 4.0
			gravity = 0.06
			#地面扬尘的不透明度（0.02..1.0）。只对本模组自己的 ground_dust 粒子有效。
			# Default: 0.6
			# Range: 0.02 ~ 1.0
			alpha = 0.6
			#地面扬尘每个粒子的大小在这个区间内随机，单位格（0.1..16，下限）。尘被搅起来会散成大小不一的一片，这是随机区间的下限。
			# Default: 2.0
			# Range: 0.1 ~ 16.0
			sizeMin = 2.0
			#地面扬尘粒子大小的上限，单位格（0.1..16）。比下限低时按下限算。
			# Default: 4.0
			# Range: 0.1 ~ 16.0
			sizeMax = 4.0
			#地面扬尘每个粒子的水平拉伸倍数下限（1..6）。1 是圆的，越大越扁（水平方向被拉长）；与上限一起给每个粒子随机取一个倍数。
			# Default: 1.0
			# Range: 1.0 ~ 6.0
			stretchMin = 1.0
			#地面扬尘水平拉伸的上限（1..6）。比下限低时按下限算。
			# Default: 1.5
			# Range: 1.0 ~ 6.0
			stretchMax = 1.5
			#地面扬尘淡出占寿命的比例（0.02~1.0）。0.5 表示后半生逐渐透明到 0；这个粒子是靠透明度而不是缩小散掉的，所以这一项直接决定「散得干不干净」。
			# Default: 0.5
			# Range: 0.02 ~ 1.0
			fade = 0.5

