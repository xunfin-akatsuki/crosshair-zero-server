			# Range: 0 ~ 200
			count = 40
			#在炮口周围多大半径内找载具表面，单位格（0.1..16）；同一个半径还用来判断哪些方块属于这辆车（离得比它远的方块不参与）。
			# Default: 16.0
			# Range: 0.1 ~ 16.0
			radius = 16.0
			#车体扬尘每个粒子的大小在这个区间内随机，单位格（0.1..16，下限）。从车壳上蹭下来的一层尘，尺寸取这个区间内的随机值。
			# Default: 2.0
			# Range: 0.1 ~ 16.0
			sizeMin = 2.0
			#车体扬尘粒子大小的上限，单位格（0.1..16）。比下限低时按下限算。
			# Default: 3.0
			# Range: 0.1 ~ 16.0
			sizeMax = 3.0
			#车体扬尘贴着表面被吹开的速度，单位格/tick（0..16），还要乘一个按距离的衰减：越靠近炮口的尘吹得越快。
			# Default: 1.0
			# Range: 0.0 ~ 16.0
			speed = 1.0
			#车体扬尘每个粒子的水平拉伸倍数下限（1..6），默认 3。1 是圆的，越大越扁（水平方向被拉长）；与上限一起给每个粒子随机取一个倍数。
			# Default: 3.0
			# Range: 1.0 ~ 6.0
			stretchMin = 3.0
			#车体扬尘水平拉伸的上限（1..6）。比下限低时按下限算。
			# Default: 6.0
			# Range: 1.0 ~ 6.0
			stretchMax = 6.0
			#每个落点上车体扬尘撒开的半径，单位格（0..16）；一层薄薄的尘就够，撒得太开反而不像贴着车壳。
			# Default: 1.2
			# Range: 0.0 ~ 16.0
			scatter = 1.2
			#车体扬尘水平速度每 tick 保留多少（0.1..1.0）。只对本模组自己的 ground_dust 粒子有效。
			# Default: 0.8
			# Range: 0.1 ~ 1.0
			damping = 0.8
			#车体扬尘的下沉加速度，单位格/tick²（0..4）。竖直方向只有重力、没有向上的力，让它贴着车壳往下掉。只对本模组自己的 ground_dust 粒子有效。
			# Default: 0.1
			# Range: 0.0 ~ 4.0
			gravity = 0.1
			#车体扬尘淡出占寿命的比例（0.02~1.0）。贴在车壳上的一层薄尘，同样靠透明度散掉；嫌它消失得太突然就调大，嫌糊住车体就调小。
			# Default: 0.5
			# Range: 0.02 ~ 1.0
			fade = 0.5
			#车体扬尘的不透明度（0.02..1.0）。一层薄尘不需要太实，免得糊住车体。只对本模组自己的 ground_dust 粒子有效。
			# Default: 0.2
			# Range: 0.02 ~ 1.0
			alpha = 0.2

[haze]
	#**炮口薄烟总开关**（默认开）。薄烟是自动炮、双管自动炮与坦克炮共同的炮口效果；巨炮不走这条路（它自己的烟已经够大）。薄烟与车体尘幕是两件互不相干的效果，各自有开关：这一项管薄烟，[hullDust] 那一项管车体尘幕实验，两者可以同时开。
	enabled = true
	#薄烟出生时的向外速度，单位格/tick（0~0.4）。0 表示只停在炮口不动；这是「看得出扩散」的起点。默认 0.03：机炮要的是一小团，不是炸开一圈。
	# Default: 0.03
	# Range: 0.0 ~ 0.4
	muzzleSpread = 0.03
	#向外速度的上限，单位格/tick（0~0.6）。薄烟朝出生方向缓慢加速到这个速度后保持，所以扩散看得见、又不会一路加速。默认 0.05：配上面那项正好团在炮口附近。
	# Default: 0.05
	# Range: 0.0 ~ 0.6
	muzzleDrift = 0.05
	#薄烟的下沉加速度，单位格/tick²（0~0.04）。默认 0：**不下沉**，薄烟只做水平扩散然后散掉。设成 0.004 之类才会慢慢沉，且下沉时受下面那项保护、不会没入地面。
	# Default: 0.0
	# Range: 0.0 ~ 0.04
	muzzleSink = 0.0
	#只在薄烟会下沉时不小于这个离地高度，单位格（0~8），默认 1.0。烟团中心到下方方块顶面小于它时会被抬回这个高度并停止下沉。不下沉时这一项不参与。
	# Default: 1.0
	# Range: 0.0 ~ 8.0
	muzzleClearance = 1.0
	#每次开炮对附近已有薄烟的水平推力，单位格/tick（0~0.4）；0 禁用推烟。方向是远离炮口的水平方向。默认 0.02：机炮的烟只被轻轻推开一点、成团聚在炮口，而不是被吹散。
	# Default: 0.02
	# Range: 0.0 ~ 0.4
	muzzlePush = 0.02
	#推烟作用半径，单位格（0.5~24）；不影响灯光范围。默认 3.0：与薄烟自成团的范围同量级，再大的烟本来也飘在别处。
	# Default: 3.0
	# Range: 0.5 ~ 24.0
	muzzlePushRadius = 3.0
	#薄烟受动态光影响的倍率（0~4）：0 只看原版光照，1.6 等于按灯在该点的强度把烟提亮到两倍多。粒子是半透明几何、画在 GPU 光路之后，所以那条光路照不到它——这一条是让薄烟能被炮口闪光与射灯照亮的办法。只在有灯覆盖的位置生效。
	# Default: 1.6
	# Range: 0.0 ~ 4.0
	lightGain = 1.6
	#同一发射器两次补烟的最小间隔 tick（0..100）。**默认 0：每一炮都补烟**——用户实测 0.1.32 会「隔几炮才冒一次烟」，看不出规律，薄烟本应每炮都有。设成 6 之类会省一半以上烟粒子（性能吃紧时的旋钮），代价就是连射时烟会一跳一跳地出现。不影响火焰、灯光和推烟事件。
	# Default: 0
	# Range: 0 ~ 100
	hazeInterval = 0
	#每次补充烟层的粒子上限。
	# Default: 4
	# Range: 0 ~ 24
	hazeCount = 4
	#稀薄烟层寿命 tick。
	# Default: 100
	# Range: 10 ~ 400
	hazeLifetime = 100
	#烟层峰值不透明度，不发光，受现有渲染通道照明。
	# Default: 0.3
	# Range: 0.02 ~ 0.8
	hazeAlpha = 0.3
	#烟层粒子直径，单位格。
	# Default: 8.0
	# Range: 0.5 ~ 16.0
	hazeSize = 8.0

[hullDust]
	#**实验：车体尘幕**（默认关闭以便 A/B）。尘落在车体表面上，支持 Sable 连接链；与炮口薄烟无关，薄烟无需载具、普通大炮不变。
	enabled = false
	#实验车体尘幕的三维表面搜索半径：尘要落在车体表面上，就得先在炮口附近搜出表面，长炮管需适当增大，单位格（1..48）。与炮口薄烟无关——薄烟不需要搜索。
	# Default: 16.0
	# Range: 1.0 ~ 48.0
	radius = 16.0

[staticSources]
	#注册光源最远发给多少格之外的玩家，单位格（0..32768）；0 表示所有光源发给所有人。客户端本来就会丢掉超出自己激活距离的光源，所以发过去只费带宽和一点客户端算力。强制启用的光源（模式 2）永远都发，因为客户端被告知要一直留着它们。
	# Default: 1024.0
	# Range: 0.0 ~ 32768.0
	sendRange = 1024.0

	[staticSources.spotlight]
		#距离档位表的最小值，单位格（1..512）。页面上每一档代表多少格由这张表换算，手电筒的 range 也用它；最小值抬高后，比它低的档位会被顶到这个下限。
		# Default: 16
		# Range: 1 ~ 512
		minimumDistance = 16
		#距离档位表的最大值，单位格（1..512），不能小于最小值，否则整张表会被反过来算。512 是炮口闪光能照到的距离，调小等于让最远的灯也照不到那么远。
		# Default: 512
		# Range: 1 ~ 512
		maximumDistance = 512
		#相邻两档之间隔多少格（1..512）。档数 = 1 + ceil((最大值 - 最小值) / 本值)，最多 32 档；步长越小档位越细，页面上的档数越多。
		# Default: 32
		# Range: 1 ~ 512
		distanceStep = 32

	[staticSources.colors]
		#点名指定某个方块用什么颜色：一行一条，写法是 命名空间:方块=颜色名（例如 create:red_ramp=red），也可以留空。写在这里的方块直接用这个颜色，不再看下面的名字猜测；列表为空时全部靠名字猜。
		overrides = []
		#允许按方块自己的名字猜颜色。关掉后只有上面 overrides 里点名的方块有颜色，其它方块一律用调色板默认色；名字里本来就没有颜色词的方块，开着也猜不出来。
		guessFromName = true

[generators]
	#所有生成器的总开关。关掉后立刻停止产生粒子，已经记住的目标表也会清空；每个生成器自己的页面上还有单独的开关，两个都开着才会发。
	enabled = true
	#每隔多少 tick 重新扫描一次世界里已装配的生成器，单位 tick（5..1200）。调大省性能：新放下的生成器最多要等这么久才开始工作；两次扫描之间一直用上次记住的位置。
	# Default: 40
	# Range: 5 ~ 1200
	scanBodyIntervalTicks = 40
	#每隔多少 tick 发射一轮，单位 tick（1..20）。它同时是速度的测量间隔（位置差除以本值得到格/tick），所以调大等于把量到的速度按比例放大，扬尘会跟着变多。
	# Default: 2
	# Range: 1 ~ 20
	emitIntervalTicks = 2
	#所有生成器每轮共用的粒子预算，单位个（0..2000）。按生成器顺序先到先得，额度用光的生成器这一轮什么都不发；0 等于全部关掉。
	# Default: 60
	# Range: 0 ~ 2000
	particlesPerTick = 60
	#全局调试日志开关（默认关闭）：不只管生成器，炮口扬尘、后坐力、Voxy/LSS 刷新、迪斯科、曳光弹喂位置和几个页面也会读它（共 20 多处）。打开后这些地方都会写日志，调参时才开，免得正式服务器刷屏。想一次全开就用上面的 debug.effects。
	debugLog = false

	[generators.dust]
		#地面扬尘的产生速率，按车速线性缩放（0..200，每 tick 的粒子数上限）。实际数量 = 车速(格/tick) × 本值，再受 maxPerScan 和 particlesPerTick 夹一次；车速为 0 时什么也不发（除非该方块开了连续发射）。
		# Default: 8.0
		# Range: 0.0 ~ 200.0
		rate = 8.0
		#一次扫描最多发几个地面扬尘粒子（0..200）。它只夹住按车速算出来的数量，是防止速度异常时爆量的上限；比产生的量低时以本值为准。
		# Default: 6
		# Range: 0 ~ 200
		maxPerScan = 6
		#从生成器位置往下最多找多少格地面，单位格（1..128）。找得太浅，车在低处或桥上会找不到地面而不发尘；调大只是多一点射线检测。
		# Default: 12
		# Range: 1 ~ 128
		searchDepth = 12
		#低于这个水平速度就不发地面扬尘了，单位格/tick（0..4）。0 等于只要动一下就发；该方块开了连续发射时这项不生效。
		# Default: 0.05
		# Range: 0.0 ~ 4.0
		minSpeed = 0.05
		#地面扬尘每个粒子的存活时间在这个区间内随机，单位 tick（1..400，最小值）。和 lifetimeMax 一起决定一蓬尘从新到旧的层次。
		# Default: 40
		# Range: 1 ~ 400
		lifetimeMin = 40
		#地面扬尘存活时间的上限，单位 tick（1..400）。比最小值低时按最小值算（区间反过来读不会报错，只是没有随机）。
		# Default: 60
		# Range: 1 ~ 400
		lifetimeMax = 60
		#地面扬尘每个粒子的大小在这个区间内随机，单位格（0.1..16，最小值）。
		# Default: 1.0
		# Range: 0.1 ~ 16.0
		sizeMin = 1.0
		#地面扬尘粒子大小的上限，单位格（0.1..16）。比最小值低时按最小值算。
		# Default: 2.0
		# Range: 0.1 ~ 16.0
		sizeMax = 2.0
		#地面扬尘每个粒子的水平拉伸倍数下限（1..6）。1 是圆的，越大越扁。只对本模组的 sablelightoverhaul:ground_dust 粒子有效。
		# Default: 1.0
		# Range: 1.0 ~ 6.0
		stretchMin = 1.0
		#地面扬尘水平拉伸的上限（1..6）。比最小值低时按最小值算。同样只对本模组自己的 ground_dust 粒子有效。
		# Default: 1.0
		# Range: 1.0 ~ 6.0
		stretchMax = 1.0
		#地面扬尘被扬起的垂直初速度下限，单位格/tick（0..4）。轨道尘是向上扬再落回来的，横向没有速度。
		# Default: 0.05
		# Range: 0.0 ~ 4.0
		upSpeedMin = 0.05
		#地面扬尘垂直初速度的上限，单位格/tick（0..4）；在这个区间里随机，让一蓬尘有高有低。比最小值低时按最小值算（等于全都一样高）。
		# Default: 0.08
		# Range: 0.0 ~ 4.0
		upSpeedMax = 0.08
		#轨道尘撒在多大的半径内，单位格（0..16），以找到的那点地面为中心。调大让它读起来是一片地被搅动，而不是一个点在冒烟。生成器页面里也有同名项，页面上的值优先。
		# Default: 1.0
		# Range: 0.0 ~ 16.0
		scatter = 1.0
		#让地面扬尘取它落到的那块方块的颜色（原版地图色）。关掉就用粒子自己写在贴图参数里的颜色。生成器页面里也有同名项，页面上的值优先。
		tintFromBlock = false

	[generators.smoke]
		#红石信号 15 时每隔多少 tick 发一次烟，单位 tick（1..200）。信号越低间隔按比例拉长，到 intervalAtMinSignal；该方块开了连续发射时按 15 算。
		# Default: 2
		# Range: 1 ~ 200
		intervalAtMaxSignal = 2
		#红石信号 1（最弱）时每隔多少 tick 发一次烟，单位 tick（1..200）。比 maxSignal 那项大才是正常的，反过来的话信号越强反而越慢。
		# Default: 10
		# Range: 1 ~ 200
		intervalAtMinSignal = 10
		#红石信号 15 时每次发几个烟粒子（0..64）。信号越低按比例减少到 countAtMinSignal；0 等于信号满时也不发。
		# Default: 2
		# Range: 0 ~ 64
		countAtMaxSignal = 2
		#红石信号 1 时每次发几个烟粒子（0..64）。要让它真的冒烟，这项至少是 1。
		# Default: 1
		# Range: 0 ~ 64
		countAtMinSignal = 1
		#生成器页面里 riseSpeed 一栏的初始值，单位格/tick（0..2）。这一项**现在是生效的**：排烟口默认用的是本模组自己的 sablelightoverhaul:smoke 粒子，发烟时它作为向上的初速加到方向×速度之上（页面里每台还能单独调）。
		# Default: 0.03
		# Range: 0.0 ~ 2.0
		riseSpeed = 0.03
		#排烟口朝哪个方向，单位度（0..360）：0 是南（+Z），90 是西（-X），180 是北，270 是东。方向在载具自身坐标系里算好再转到世界，所以船转了管子仍然朝着同一个出口。
		# Default: 0.0
		# Range: 0.0 ~ 360.0
		directionYaw = 0.0
		#排烟口的仰角，单位度（-90..90）；90 是正上方，-90 是正下方。同样跟着载具的姿态走。
		# Default: 0.0
		# Range: -90.0 ~ 90.0
		directionPitch = 0.0
		#烟离开管口的速度，单位格/tick（0..4）。烟不继承载具自己的速度：粒子不跟车走，继承只会把云从管口抹开。
		# Default: 0.15
		# Range: 0.0 ~ 4.0
		speed = 0.15
		#管口相对生成器方块的高度，单位格（-16..16）。只有排烟口能自己定高度：地面扬尘的高度由找到的地面决定。
		# Default: 0.0
		# Range: -16.0 ~ 16.0
		offsetY = 0.0
		#生成器页面里 lifetime 一栏的初始值，单位 tick（1..600）。这一项**现在是生效的**：排烟口默认用的是本模组自己的 sablelightoverhaul:smoke 粒子，寿命由它接管。
		# Default: 90
		# Range: 1 ~ 600
		lifetime = 90
		#生成器页面里 size 一栏的初始值，单位格（0.05..16）。烟默认用的是本模组自己的 sablelightoverhaul:smoke 粒子，所以**这一栏现在真的决定烟团大小**；把它指向任何原版粒子则这一栏无效（原版粒子尺寸由它自己定）。
		# Default: 0.9
		# Range: 0.05 ~ 16.0
		size = 0.9
		#排烟口出生不透明度（0.02..1.0），默认 0.5 = 烟离开管口时半透明。它决定「这团烟有多浓」，与浓度无关的另一半是每 tick 发几个（countAtMaxSignal/countAtMinSignal）。**只对本模组自己的 sablelightoverhaul:smoke 粒子有效**（原版粒子自己决定不透明度，改这里没用），生成器页面里每台还有个 opacity 一栏会盖过它。
		# Default: 0.5
		# Range: 0.02 ~ 1.0
		opacity = 0.5
		#排烟口淡出占寿命的比例（0.02..1.0），默认 0.4 = 寿命前 60% 保持出生不透明度、最后 40% 按二次曲线淡出。调大 = 更早变淡（烟更「薄」、更快散）；调小 = 更久保持浓，接近寿命末端才消失。配合 lifetime 使用：寿命长 + fade 小 = 远处慢慢散开的大片烟。**只对本模组自己的 sablelightoverhaul:smoke 粒子有效**，页面里的 fade 一栏会盖过它。
		# Default: 0.4
		# Range: 0.02 ~ 1.0
		fade = 0.4

	[generators.dustPhysics]
		#尘埃水平速度每 tick 保留多少（0.1..1.0）。1 是不减速、会让尘一直滑；默认的 0.75 让它几乎停在被搅起来的地方。只对本模组自己的 ground_dust 粒子有效。
		# Default: 0.75
		# Range: 0.1 ~ 1.0
		horizontalDamping = 0.75
		#尘埃的下沉加速度，单位格/tick²（0..4）。竖直方向只有它：尘不会被风托住。只对本模组自己的 ground_dust 粒子有效。
		# Default: 0.08
		# Range: 0.0 ~ 4.0
		gravity = 0.08
		#尘埃的不透明度（0.02..1.0）。只对本模组自己的 ground_dust 粒子有效，原版粒子没有这个参数。
		# Default: 0.35
		# Range: 0.02 ~ 1.0
		alpha = 0.35
		#尘埃淡出占寿命的比例（0.02..1.0）。0.4 是本模组一直以来的行为：寿命前 60% 保持出生不透明度，最后 40% 按二次曲线淡出（见 ParticleFade）。调大 = 更早开始变淡、结尾更柔；1.0 = 出生即开始淡出；越小越接近「一直不透明、到寿命末端突然消失」。**只对本模组自己的 ground_dust 粒子有效**，而且生成器页面里每台还有个 fade 一栏会盖过它。
		# Default: 0.4
		# Range: 0.02 ~ 1.0
		fade = 0.4

[Particle]
	#**生成器周围多近必须有玩家**才会产生粒子，单位格（8..2048，默认 1024）。附近没人时这一轮什么都不发。
	# Default: 1024
	# Range: 8 ~ 2048
	generatorCull = 1024
	#把本模组与白名单里的爆炸粒子用长距离标记送出去，绕过原版的 32 格。关掉恢复原版行为，代价是带宽。
	forceLoad = true
	#**炮口粒子发给多远内的玩家**，单位格（8..2048，默认 1024），所有炮种共用。
	# Default: 1024
	# Range: 8 ~ 2048
	muzzleCull = 1024
	#**冲击波数据发给多远内的玩家**，单位格（8..8192，默认 1024）。客户端照这些数据画，所以它也是冲击波能被看见的距离。
	# Default: 1024.0
	# Range: 8.0 ~ 8192.0
	shockwaveRange = 1024.0
	#**曳光弹尾迹在多远内生成**，单位格（32..8192，默认 1024）。调小会让远处的炮弹只剩光没有尾。
	# Default: 1024
	# Range: 32 ~ 8192
	tracerFeedRange = 1024
	#**爆炸粒子发给多远内的玩家**，单位格（8..2048，默认 1024）。只对白名单里的 CBC 爆炸粒子生效（blast wave、烟、碎片），近距离细节粒子不受影响。
	# Default: 1024
	# Range: 8 ~ 2048
	explosionCull = 1024

[profiles]
	#逐炮档案总开关。**暂时默认关闭**：关闭时任何一门炮都只按配置文件里的值表现，开炮不会读取逐炮档案，档案页也会拒绝写入并说明原因。这样你可以只改配置、看行为变化，来核对每个配置项的分类与说明是否正确；确认无误后再打开它。
	enabled = false

[debug]
	#**一次打开服务端全部诊断日志的总开关**：打开它等于把下面每一项都打开（炮口扬尘、后坐力、Voxy/LSS、迪斯科、曳光喂送、爆炸测量）。各项仍可单独打开。正常游玩保持关闭。
	effects = false

[explosions]
	#爆炸报告的方块表小于这个数就不算数，不会有光和冲击波（1..1000000）。注意这个大数的真实含义：CBC 给的是爆炸周围走到的方块，会随炮弹埋进的实心材料变多（KubeJS 脚本就是靠它区分打石头、打地表和空爆），不是它炸掉的方块数；原版 TNT 大约报告 400，苦力怕少得多。所以这是形状门槛：把苦力怕和手雷挡在外面，让 TNT 大小的爆炸通过，任何模组都一样。
	# Default: 200
	# Range: 1 ~ 1000000
	minimumBlocks = 200
	#**判定地心爆炸**：从爆心向上找多少格内有实体方块就算埋在东西底下（0..32，默认 6）。注意它会自动处理弹坑 —— 弹坑上方是天空，所以弹坑仍算地爆。副作用：打在船体内部的爆炸也算埋着，于是不出外围两组（船舱里滚出尘环本来就不对）。
	# Default: 6
	# Range: 0 ~ 32
	blastBuriedDepth = 6
	#**爆炸规模的第二个门槛：爆炸力（= `Explosion.radius()`，原版 TNT 是 4、爬行者 3、CBC 炮弹 6~32）**，范围 0~64，默认 4 = TNT 及以上都算数。意义：**不是每个来源都有 CBC 的装药数据** —— 原版 TNT 与别的模组的爆炸只有这个半径，而它们可能炸掉的方块少于 200。于是关卡是：**爆炸力 ≥ 本值，或受影响方块数 ≥ explosions.minimumBlocks，任一满足就画**（手雷/爬行者两个都不满足 ⇒ 仍然保持不亮，不会把枪战变成频闪灯）。两种信号各自驱动各自的尺寸：光与球面波按爆炸力缩放，尘环按方块数分档。
	# Default: 4.0
	# Range: 0.0 ~ 64.0
	minimumPower = 4.0
	#判空爆的高度带：爆心高出本地地表这么多格以上就直接算空爆（0~128，默认 12）。比它低时才看下/上触达比（地爆被地面挡住 ⇒ 下远小于上）。实测教训：y=93、地表 65 的空爆，向下射线被几十格外的地面挡住，比例判据把它误判成地爆，所以高度必须先于比例生效。
	# Default: 12.0
	# Range: 0.0 ~ 128.0
	airBand = 12.0
	#**判定地爆/空爆**：爆心高出本地地表这么多格以内就算地爆（0..64，默认 4）。地表用 MOTION_BLOCKING 高度图读，弹坑里读到的就是坑底，所以弹坑自然归地爆。
	# Default: 4.0
	# Range: 0.0 ~ 64.0
	blastGroundBand = 4.0
	#**判定地心爆炸的第二条**：实测 solidity（0=开阔，1=深埋岩石）超过它也算埋着（0..1，默认 0.85）。
	# Default: 0.85
	# Range: 0.0 ~ 1.0
	blastBuriedSolidity = 0.85
	#**判定地爆/空爆的第二条**：四个向下八分仪的实测触达 ÷ 四个向上的，小于它就算地爆（0..4，默认 0.75）。地爆被地面挡住 ⇒ 下≪上；空爆 ⇒ 下≈上。它与高度判据是「或」的关系。
	# Default: 0.75
	# Range: 0.0 ~ 4.0
	blastDownUpRatio = 0.75
	#每一档冲击波从多大的破片爆炸力开始，升序（整数，列表默认 6/12/18/24/32）。五个数就是六档：低于第一个是第 1 档，达到或超过最后一个是第 6 档；档位只写进发给客户端的消息里（客户端目前只在日志里用它），光的亮度和尺寸由 lightCharge/lightSizeScale 和实测范围决定。留空则所有爆炸都是第 1 档。
	yieldTiers = [6, 12, 18, 24, 32]
	#爆炸光的强度基准（0..64）。实际强度 = 本值 × (爆炸力 / 参考爆炸力) × (0.35 + 0.65 × 暴露度)：埋得越深、被挡得越多，光越暗。它只管亮度；光的半径不是被炸掉的方块数，而是爆炸实测的平均作用距离乘 lightSizeScale（见下面那一项）。
	# Default: 5.0
	# Range: 0.0 ~ 64.0
	lightCharge = 5.0
	#爆炸光半径相对实测平均作用距离的倍数（0.05..8）。1.0 等于光和爆炸实际达到的范围一样宽；没有光影包压高光、觉得光太散太大时往下调。
	# Default: 1.0
	# Range: 0.05 ~ 8.0
	lightSizeScale = 1.0

	[explosions.light]
		#**爆炸闪光**的开关，只管那两盏光。爆炸仍会被测量，也仍会给客户端发冲击波数据（见下一条），只是不再亮。为什么与载荷分开：光很省，载荷在客户端展开成很多粒子，不见得省，所以各有各的开关。
		enabled = true

	[explosions.shockwave]
		#**是否把爆炸的测量数据发给客户端**（客户端据此画尘环与球面波）。服务端这一侧只管发；客户端还要它自己的 `shockwave.enabled` 才会真的画。关掉后爆炸仍会亮，只是不再有冲击波。旧键 `explosions.enabled` 已拆成 `explosions.light.enabled` 与这一条：若你曾把它关掉，请把这两条也关掉。
		enabled = true

[tracerFeed]
	#在服务端为每一发曳光弹生成尾迹，这样它在任何距离都看得见，而不是在客户端停止追踪炮弹的地方断掉。关掉后尾迹只剩客户端自己画的那一段（约 160 格）。
	feedEnabled = true
	#**每秒打印一行曳光喂送日志**（默认关闭）：这一秒喂了几发、几发没有曳光、几发超出范围、通知了几个人。用来分辨是服务器数据源停了还是客户端没画出来。
	debug = false

[voxy]
	#爆炸破坏方块之后，请 Voxy/LSS 重发它改动过的列，好让坑出现在客户端远处的 LOD 里。没有装 LSS 服务端模组时完全没有作用；它也不依赖上面那两条爆炸开关，把爆炸光与冲击波都关掉之后坑一样会刷新。
	enabled = true
	#改动过的区块同时标记为未保存并写盘。服务端是从内存里发已加载区块的，所以这项只为正确性：某个请求在区块卸载之后才到，否则会被过期的区域文件回答。写盘发生在主线程，所以下面还有限流。
	saveChunks = true
	#一次事件最多标记多少列（1..512）。大爆炸会覆盖很多区块，客户端每重新问一列都是一整列的数据，这个数是单次爆炸开销的天花板；超过的列这一轮不再标记。
	# Default: 64
	# Range: 1 ~ 512
	maxColumnsPerEvent = 64
	#**爆炸后多久才把 LOD 重推出去（tick）**，0~400，默认 40（2 秒）。背景：Voxy 一旦摄入某段就基本冻结，只有重新摄取才能让弹坑出现在远处 LOD 里，所以我们爆炸后会主动标记这些列变脏；而客户端重新摄取的那一两秒里那些段读不到，我们的 LOD 遮挡射线就会看到「空洞」而放行，于是只在爆炸时漏。把这个延迟调大（比如 60）能让弹坑稍晚出现、但彻底避开与遮挡的竞态；调 0 = 立即推送（旧行为）。
	# Default: 20
	# Range: 0 ~ 400
	nudgeDelay = 20
	#爆炸报告的方块表小于这个数就不做 LOD 刷新，手雷不值得刷一次（1..100000）。注意大炮弹上这个数的真实含义：CBC 给的是爆炸周围走到的方块，会随炮弹埋进的实心材料变多，不是炸掉的方块数，所以它是形状门槛而不是伤害门槛。
	# Default: 4
	# Range: 1 ~ 100000
	minimumBlocks = 4
	#两次限流写盘之间最短隔多少 tick（1..1200）。只在 voxy.saveChunks 打开时才用到，调小等于更频繁地在主线程写盘。
	# Default: 40
	# Range: 1 ~ 1200
	saveIntervalTicks = 40
	#距离改动的列这么近的玩家（单位格，0..8192）会立刻收到通知，而不用等 LSS 自己的广播（默认 10 秒）。没有人会被漏掉：其它人仍然会收到正常推送，这一项只决定谁先知道，好让真正看得见爆炸的人在烟还没散的时候 LOD 就刷新了。0 关闭这一档。
	# Default: 512
	# Range: 0 ~ 8192
	immediateRange = 512

[flashlight]
	#手电筒光束的颜色，用和灯一样的调色板索引（0..15）。只是新玩家的初始值，页面改过的玩家用自己存下来的颜色。
	# Default: 0
	# Range: 0 ~ 15
	color = 0
	#手电筒光束的长度，以距离档位表示（1..32）。页面显示的是它换算出来的格数，按默认的 16/32/512 表第 3 档等于 80 格；FlashlightSettings 会把它夹到当前表实际有的档位。这里只能是字面量默认值，不能写 count()/2：在 spec 自己的静态初始化里读配置值会在文件加载前抛异常。
	# Default: 3
	# Range: 1 ~ 32
	range = 3
	#手电筒光束的宽度，写成完整的度数（5..90）：5 是很窄的聚光，90 是泛光。存的是度数而不是 1..15 的粗细信号，所以页面上的数就是画出来的数。
	# Default: 22
	# Range: 5 ~ 90
	width = 22
	#光束沿自身长度变暗的快慢，写成参考形状的百分比（20..300）。100 是参考：轴心全亮、半程一半亮、到头上刚好没有；300 是短而亮的亮斑，20 几乎整条光束都亮着（探照灯就是这样）。它只决定长度方向，横截面看下面的 falloff。
	# Default: 100
	# Range: 20 ~ 300
	decay = 100
	#手电筒的横截面：射灯那五档角度曲线之一（0 强制最大、整个锥面一样亮，1 快，2 均匀，3 慢，4 暗）。和 decay 互相独立，decay 只管长度。页面里没被操作员改过的玩家用这个默认值。
	# Default: 2
	# Range: 0 ~ 4
	falloff = 2
	#手电筒光束的亮度（0..15）。0 等于光束不亮，但点光还可能亮着（那是下面两项管的）。
	# Default: 10
	# Range: 0 ~ 15
	intensity = 10
	#玩家身上那盏小点光的半径，单位格（0..24）；0 关掉。和光束不同，这盏是会随距离衰减的。
	# Default: 3
	# Range: 0 ~ 24
	pointRadius = 3
	#那盏点光的亮度（0..15）。
	# Default: 10
	# Range: 0 ~ 15
	pointIntensity = 10
	#别人的手电筒最远在多少格内还画出来（0..128）；0 表示完全不再把别人的灯发给客户端。默认值等于原版的玩家追踪距离，那也正是客户端能被要求画的极限：没在追踪的玩家没有位置，光束就没有起点。
	# Default: 48
	# Range: 0 ~ 128
	syncRange = 48

[disco]
	#灯球循环用的调色板索引，逗号分隔（每一项 0..15）：0 是配置的默认色，1..14 是染料色，15 是闪光色；解析不了的项会被忽略。放下灯球时由 useConfiguredDefaults() 抄到球自己身上，之后以球上的值为准；客户端自己的 disco.colors 只在球上还没有存值时兜底。
	colors = "1,4,11,14"
	#灯球几束光（1..32）。放下灯球时抄到球上，之后以球上的值为准（页面改过的球用自己的）；客户端自己的 disco.beams 只在球上还没有存值时兜底。
	# Default: 8
	# Range: 1 ~ 32
	beams = 8
	#灯球每 tick 转多少度（0..90）；0 等于不转。放下灯球时抄到球上，之后以球上的值为准；客户端自己的 disco.spin 只在球上还没有存值时兜底。
	# Default: 1.5
	# Range: 0.0 ~ 90.0
	spinDegreesPerTick = 1.5
	#每束光多长，单位格（1..128）。放下灯球时抄到球上，之后以球上的值为准；客户端自己的 disco.range 只在球上还没有存值时兜底。
	# Default: 32
	# Range: 1 ~ 128
	range = 32
	#每束光多宽，用射灯的宽度档（0..15；0 最窄，15 最宽）。放下灯球时抄到球上，之后以球上的值为准；客户端自己的 disco.width 只在球上还没有存值时兜底。
	# Default: 2
	# Range: 0 ~ 15
	width = 2
	#每束光的亮度（0..15）。放下灯球时抄到球上，之后以球上的值为准；客户端自己的 disco.intensity 只在球上还没有存值时兜底。
	# Default: 6.0
	# Range: 0.0 ~ 15.0
	intensity = 6.0
	#灯球的衰减曲线，和射灯那五档一样（0 强制最大、整个光斑一样亮、1 快、2 均匀、3 慢、4 暗）。放下灯球时抄到球上，之后以球上的值为准；客户端自己的 disco.falloff 只在球上还没有存值时兜底。
	# Default: 0
	# Range: 0 ~ 4
	falloff = 0

[farEntities]
	#把名字匹配的实体（默认就是组装后的炮这种 contraption）发送到 farEntities.range 那么远，而不是原版的客户端视距。关掉即回到原版行为：视距外只剩船体、看不见炮。功能上炮一直是好的（能开火），这一项只管它有没有被发到你的客户端。
	enabled = true
	#实体注册名 path 里含有这些片段的才算超视距实体（区分大小写）。默认 [cannon, flap, pitch_contraption, munitions_contraption]。留空等于关闭。匹配的是实体类型名而不是实体自定义名，所以给船上的炮改名不影响匹配。有两个名字必须写全：CBC 组装后的炮注册为 createbigcannons:pitch_contraption，CBCMW 的为 cbcmodernwarfare:munitions_contraption，两者都既不含 cannon 也不含 flap（CBCMW 的 MountedMediumcannonContraption 只是挂在 pitch_contraption 上的炮种，不是实体类型）。cannon 负责 CBC 的 cannon_carriage 等，flap 负责 compactflap。加得越多，远处玩家要收的位置包越多。
	names = ["cannon", "flap", "pitch_contraption", "munitions_contraption"]
	#超视距实体最多发给多少格以内的玩家，单位格（16..8192）。默认 512。Sable 自己的 sub_level_tracking_range 默认 320，SSRD 那根滑条在本实例被设成 122 区块（约 1950 格）；想让炮和船体一样远，就把这里调到不小于它，代价是远处的实体同步量。
	# Default: 512
	# Range: 16 ~ 8192
	range = 512
	#每秒在服务端日志里打印一行超视距实体的实况：服务端一共认得几个名字匹配的实体、各自离每个玩家多远、所在区块是否已经发给这个玩家（原版的 isChunkTracked）、以及它是不是骑在别的实体上。这是分辨两种截然不同的情况唯一的手段——实体在服务端就已经不在你附近（Sable 把整个子场景停到 plot 坐标去了，此时补渲染和补追踪都没用），还是实体就在你附近、只是原版按视距没发给你（此时才是追踪钳制的问题）。正常游玩保持关闭。
	debug = false
