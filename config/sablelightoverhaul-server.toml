			maxTravel = 0.35
			#复进（推回原位）的峰值速度（格/tick，0.01~4）。returnShape=0 时它就是全程速度；=1 时它是起步速度，之后随剩余行程变小而变慢。默认 0.12。
			# Default: 0.12
			# Range: 0.01 ~ 4.0
			returnSpeed = 0.12
			#复进曲线（0~2）。0 = 液压：基本匀速，节奏可预测（时间 ≈ 行程 ÷ 速度）；1 = 弹簧：先快后慢；2 = 起步更猛。
			# Default: 0.0
