			color = 16777215
			#每炮地面扬尘最多几个（0..200），还要受 particlesPerShot 余额限制。实际撒在几个探测点上是取 3..8 个点，尘在这些点之间分配。
			# Default: 120
			# Range: 0 ~ 200
			count = 120
			#每个探测点往下最多找多少格地面，单位格（1..128）。找不到地面的探测点直接作废，全部作废时这一炮没有地面扬尘（调试日志里会说明）。
			# Default: 24
			# Range: 1 ~ 128
			searchDistance = 24
			#炮口周围多大范围内去找地面，单位格（0.1..32）。尘是绕着车被掀起来的，所以按半径找一圈地面，而不是只沿炮管方向找一条线。
			# Default: 16.0
			# Range: 0.1 ~ 32.0
			radius = 16.0
			#扬尘被推离炮口的速度，单位格/tick（0..16），实际乘 (0.6 + 0.4 × min(1, 装药/6))。越靠近炮口的尘被推得越快，边缘几乎不动（还有一个按距离的衰减）。
			# Default: 0.5
