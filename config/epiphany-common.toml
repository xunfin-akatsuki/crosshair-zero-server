#Maximum number of Epiphany slots a player can have
# Default: 8
# Range: 1 ~ 32
maxEpiphanySlots = 8
#Insight Points required to select a Module
# Default: 1
# Range: 0 ~ 100
moduleSelectCost = 1
#Maximum number of Modules a player can have selected at once
# Default: 8
# Range: 1 ~ 64
maxSelectedModules = 8
#Base aptitude required to earn the first Insight Point
# Default: 10
# Range: 1 ~ 9223372036854775807
baseAptitudeCap = 10
#Additional aptitude required per Insight Point already spent. Formula: cap = baseCap + totalSpent * growth
# Default: 1
# Range: 0 ~ 9223372036854775807
aptitudeCapGrowth = 1
#Notify the player when they gain Insight Points (level-up, command, reward)
notifyInsightPoints = true
#Notify the player when a Module is unlocked via condition or command. Selectable modules are NOT notified.
notifyModuleUnlock = true
#Notify the player when an Epiphany is unlocked via condition or command. Selectable epiphanies are NOT notified.
notifyEpiphanyUnlock = true
