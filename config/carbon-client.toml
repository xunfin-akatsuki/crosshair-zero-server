#Cache standard item model geometry and instance matching render submissions.
enabled = true
#Take over dropped-item models, spin and scale on the GPU. Disable to preserve other mods' dropped-item rendering and transforms.
optimizeDroppedItems = true
#Visual-only GPU tumbling and resting dropped items; requires optimizeDroppedItems. Does not change collisions, velocity or pickup.
physicalDroppedItems = false
#Skip frustum and Sodium occlusion checks for the dedicated dropped-item pipeline; distance limits still apply.
skipVisibilityChecks = true
#CPU cache update budget per frame in milliseconds. Keep drawing the previous scene until the queue completes. 0 updates immediately; a single item can exceed the budget.
# Default: 2.0
# Range: 0.0 ~ 20.0
cacheUpdateBudgetMs = 2.0
