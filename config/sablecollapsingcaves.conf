# CollapsingCaves settings.
# Delete a line to get the default value again.

# Set to true to replace the cave-in screen shake with a message across the middle of the screen on this client. The setting belongs to whoever is playing, not to the world, so it is read from this file on each side separately.
# Permitted values: true or false
MotionSicknessMode = false

# Chance denominator for a cave-in when a player breaks an applicable block. A value of 512 gives a chance of 1 in 512.
# Permitted values: 1 - 1000000
caveInChance = 1000000

# Maximum number of cave-ins that can occur at the same time.
# Permitted values: 1 - 16
maxConcurrentCaveIns = 1

# Maximum number of physics blocks that this mod keeps at the same time. Each block is a Sable sub-level and each sub-level has a cost. When the limit is reached, no more blocks fall until the blocks of a cave-in that ended go back into the world. A large cave-in with the default settings can make 4200 blocks, so a value below that number stops such a cave-in before its end. Decrease this value if the server becomes slow.
# Permitted values: 10 - 15000
maxPhysicsDebris = 10

# Number of physics blocks that a cave-in keeps while it continues. Above this number, each new block that falls sends the oldest block back into the world. The oldest block is always the first to go back. This work does not wait for a player to leave the area, because its purpose is the speed of the server. A value of 0 stops this work, and the number of blocks can then grow to the value of maxPhysicsDebris.
# Permitted values: 0 - 15000
rollingCleanupLimit = 300

# Chance that a piece which falls at the centre of a cave-in is a group of blocks instead of a single block. A value of 8 gives a chance of 1 in 8. A group moves as one body, in the manner of a part of a roof that comes away in one piece. Every block of a group counts for the limits of this mod. A value of 0 gives single blocks only at the centre. Make this number larger than multiBlockChanceAtEdge to keep the space around the player open while the edge of the cave-in closes.
# Permitted values: 0 - 100
multiBlockChanceAtCentre = 8

# Chance that a piece which falls at the outer edge of a cave-in is a group of blocks instead of a single block. A value of 2 gives a chance of 1 in 2. The chance of a piece between the centre and the edge is between the two values, and follows the distance from the centre. A group holds a way out better than the same number of single blocks, because the single blocks roll away from each other.
# Permitted values: 0 - 100
multiBlockChanceAtEdge = 2

# Chance that a group which comes away at the start of a cave-in is a large group. A value of 3 gives a chance of 1 in 3. This chance applies to a group only: a piece must first become a group, which the two options above decide. A large group stays inside a box of 4 blocks by 4 blocks by 4 blocks and can hold as many as 64 blocks, so it is much heavier than a usual group. A value of 0 gives no large group.
# Permitted values: 0 - 1000
largeGroupChanceAtStart = 3

# Chance that a group which comes away at the end of a cave-in is a large group. A value of 25 gives a chance of 1 in 25. The chance between the start and the end follows the square of the time that remains, so large groups come away in the first moments of a cave-in and are rare for the remainder of it. Make this number larger than largeGroupChanceAtStart for that result.
# Permitted values: 0 - 1000
largeGroupChanceAtEnd = 25

# Number of seconds between the moment the number of blocks goes above rollingCleanupLimit and the moment the oldest blocks start to go back into the world. This time lets each block land and stop before the mod moves it. Without this time the mod can take a block that is still in the air. The number of blocks goes above the limit during this time, by the number of blocks that fall in these seconds.
# Permitted values: 0 - 300
rollingCleanupDelaySeconds = 3

# Distance in blocks past the edge of a cave-in at which the sound of the settle work becomes silent. The work starts only after every player leaves the radius, so a small value can make the sound too quiet to hear. The sound is loudest at the centre of the cave-in.
# Permitted values: 0 - 256
cleanupSoundMarginBlocks = 60

# Number of positions that a client examines in each tick for white ash while a cave-in continues. The ash falls inside the cave-in only. A player who stands above the cave or below it sees no ash, and no ash goes outside the radius of the cave-in, into solid rock or into the light of the sky. Each position that passes those tests receives one particle, so a larger number gives more ash and more work for the computer of the player. A value of 0 gives no ash. This option belongs to the client, and each player can hold a value of their own.
# Permitted values: 0 - 200
caveAshParticles = 0

# Number of positions of floor that a client examines in each tick for smoke while a cave-in continues. The smoke comes up from the floor inside the cave-in, in the manner of dust that the blocks push out of the ground. A position that passes every test gives one particle, so a larger number gives more smoke and more work for the computer of the player. A value of 0 gives no smoke. This option belongs to the client, and each player can hold a value of their own.
# Permitted values: 0 - 200
caveSmokeAttempts = 0

# The part of the floor of a cave-in that gives smoke, as a part of one hundred. A value of 6 gives smoke from 6 blocks of floor in every 100. The blocks that give smoke come from the position of each block, so the same blocks smoke for the whole cave-in and their neighbours never do. A value of 0 gives no smoke, and a value of 100 gives smoke from every block of floor.
# Permitted values: 0 - 100
caveSmokeFloorPercent = 6

# Chance that a piece of a cave-in shows a gust of air at the moment it hits the ground. A value of 4 gives a chance of 1 in 4. A piece shows one gust, so a group of blocks shows one gust and not one gust for each block of the group. A piece that falls slowly shows no gust. A value of 0 gives no gust. The option dustParticlesEnabled stops this gust as well.
# Permitted values: 0 - 1000
gustParticleChance = 0

# How far the camera turns when a block of a cave-in hits the ground beside the player, as a part of one hundred. A value of 100 gives the same turn that damage gives. A value of 40 gives a turn that is much smaller. A value of 0 gives no turn. The block does no damage in any case: the turn of the camera is the only result. Motion sickness mode stops this turn, and the Damage Tilt setting of Minecraft makes it smaller as well. This option belongs to the client, and each player can hold a value of their own.
# Permitted values: 0 - 100
blockLandTiltStrength = 40

# How much dust is in the air inside a cave-in while it continues, as a part of one hundred. A value of 40 gives a light fog. A larger value makes the distance harder to see. A value of 0 gives no fog. The fog is inside the cave-in only: a player above the cave or below it sees no fog, in the same manner as the white ash. The fog becomes stronger across one second when a player comes in, and goes away across one second when a player goes out. The fog of water, of lava and of powder snow does not change, and a player with blindness or with darkness sees no farther than before. This option belongs to the client, and each player can hold a value of their own.
# Permitted values: 0 - 100
caveFogStrength = 0

# Number of seconds across which the fog of a cave-in becomes complete. The dust of a cave-in comes from the blocks that fall, so the air is clear at the first moment and the fog then becomes thicker. A player who comes to a cave-in that started some time ago sees the full fog at once, because that dust is already in the air. A value of 0 gives the full fog from the first moment. This option belongs to the client, and each player can hold a value of their own.
# Permitted values: 0 - 120
caveFogRampSeconds = 8

# Number of seconds across which the fog of a cave-in comes out of the air after the cave-in ends. The dust does not go away at the moment the last block stops: it comes down slowly. The fog starts this time at the quantity that it had at that moment, so a short cave-in that made little dust does not become thicker at its end. The white ash stops with the last block in every case. A value of 0 takes the fog away at once. This option belongs to the client, and each player can hold a value of their own.
# Permitted values: 0 - 120
caveFogFadeOutSeconds = 14

# Number of seconds that every player must stay outside the radius of a cave-in before its blocks start to go back into the world. A player who comes back into the radius stops the work and starts this time again. The default value of 2 is short, so the work starts almost immediately. Those 2 seconds also prevent a start and a stop of the sound in quick succession when a player walks across the edge of the radius. A value of 0 removes that protection. A large value keeps the blocks as physics blocks for longer.
# Permitted values: 0 - 600
debrisSettleGraceSeconds = 2

# Number of ticks that a block needs to move into the position and the direction of the world block that it becomes. Twenty ticks are one second. The block slides and turns across this time instead of a jump into position. A value of 0 gives the jump.
# Permitted values: 0 - 100
debrisAlignTicks = 10

# Number of minutes after a player logs in during which no cave-in can occur to that player.
# Permitted values: 0 - 1440
loginGraceMinutes = 20

# Number of minutes after a cave-in during which no new cave-in can occur to that player.
# Permitted values: 0 - 1440
caveInCooldownMinutes = 60

# Number of seconds at the start of a cave-in during which the ground rumbles and the screen shakes but no block falls yet. This time is part of the length of the cave-in, not added to it.
# Permitted values: 0 - 60
warningSeconds = 3

# Number of open positions that the mod examines in each tick when a cave-in starts. A high value makes the first blocks fall sooner, but gives more work to the server.
# Permitted values: 1024 - 262144
scanPositionsPerTick = 16384

# Damage that a block of a cave-in gives to a player or to a mob that it falls on. Two points of damage are one heart. The block must be inside the player, and it must move at 6 metres per second or more, which is a fall of one and one half blocks. One block gives this damage one time in each second. A value of 0.0 gives no damage. This damage needs no other mod.
# Permitted values: 0.0 - 40.0
fallingBlockDamage = 0.0

# Set to true to make a ragdoll of a player or of a mob that a block of a cave-in falls on. This needs the ragdoll mod for Sable. A server without that mod gives the damage above and no ragdoll, and this option then does nothing. The mod is not necessary in any other manner.
# Permitted values: true or false
fallingBlockRagdoll = true

# Set to true to let the camera go through blocks while the player is a ragdoll and the camera has no room. A player who lies under the blocks of a cave-in has blocks on every side, so Minecraft moves the camera into the head of that player and the player sees the inside of their own skin. With this setting the camera keeps its distance and goes through those blocks. The camera behaves in the usual manner at every other moment, and a player who is not a ragdoll sees no change. This needs the ragdoll mod for Sable, and it does nothing without it. This option belongs to the client, and each player can hold a value of their own.
# Permitted values: true or false
ragdollCameraIgnoresBlocks = true

# Controls where a cave-in starts its groups of blocks. A value of 0.0 gives every position the same chance. A value above 0.0 moves the groups towards the edge of the radius, which makes the cave-in close the ways out of the cave. A value of 1.0 gives a position at the edge two times the chance of a position at the centre. A value below 0.0 moves the groups towards the centre.
# Permitted values: -2.0 - 5.0
edgeSeedBias = 1.0

# How much more probable a group of blocks starts above a narrow space, such as a corridor or a way out of a cave. A value of 1.0 gives no preference. A value of 6.0 gives such a position six times the chance of a position above a large open space. A high value makes the cave-in close the ways out of the cave.
# Permitted values: 1.0 - 100.0
passageSeedWeight = 6.0

# Turn speed of a block that falls, in radians per second. The axis of the turn is different for each block, so the blocks turn as they fall and land on a corner. A value of 4.0 turns a block approximately two thirds of a full turn each second. A value of 0.0 lets the blocks fall flat.
# Permitted values: 0.0 - 10.0
spinSpeed = 4.0

# Speed away from the centre of the cave-in that a block receives when it comes away from the ceiling, in metres per second. A high value throws the blocks outward. A value of 0.0 lets the block fall straight down.
# Permitted values: 0.0 - 5.0
detachSpeed = 1.0

# Speed in a random direction on the X axis and the Z axis, in metres per second. Each block gets a different direction and a different speed. This speed is important: the blocks of one group come away from the ceiling side by side, and each block touches the blocks next to it. Blocks that touch cannot turn. This speed moves them apart, and they can then turn and roll. A low value makes the group fall as one flat layer.
# Permitted values: 0.0 - 5.0
scatterSpeed = 1.5

# Set to true to let the Gentle enchantment prevent cave-ins.
# Permitted values: true or false
gentleEnchantmentStopsCaveIns = true

# Set to true to permit a cave-in only for a player at or below the sea level of the world plus a margin of 15 blocks. The sea level is read from the world generation, so a data pack or a mod that moves it moves this limit as well.
# Permitted values: true or false
seaLevelLimitEnabled = true

# Set to true to shake the screen during a cave-in.
# Permitted values: true or false
screenShakeEnabled = false

# Set to true to play the rumble sound and the block impact sound.
# Permitted values: true or false
soundsEnabled = false

# Set to true to show dust particles when a cluster hits the ground.
# Permitted values: true or false
dustParticlesEnabled = false

# ---------------------------------------------------------------------------
# IMPORTANT: read this before you make a cave-in larger.
#
# The three values Radius, HeightAbove and DepthBelow give the size of a cave-in.
# Together they make a box around the player. The mod looks at every empty space
# inside that box to find the blocks that can fall.
#
# While the mod looks, it keeps a note of each space that it has seen. It keeps all
# of these notes until it has seen the whole cave. The notes use the memory of the
# computer that runs the game.
#
# A larger box means many more spaces. The number of spaces does not grow in a line
# with the values: two times the radius gives about four times the spaces.
#
# The values below are safe. A large cave-in with them uses approximately 3 megabytes
# for a moment. The largest permitted values, a radius of 64 with the largest height
# and depth, can use approximately 40 megabytes for one cave-in.
#
# If the computer has little free memory, a very large cave-in can make the game slow
# or can stop the game with an out-of-memory error. Make these three values larger by
# a small quantity, then play and watch the game before you make them larger again.
# ---------------------------------------------------------------------------

# Probability weight of a small cave-in against the other sizes.
# Permitted values: 0 - 1000
smallWeight = 1

# Number of seconds that a small cave-in continues.
# Permitted values: 5 - 3600
smallDurationSeconds = 60

# Number of seconds between two clusters of a small cave-in.
# Permitted values: 1 - 600
smallClusterIntervalSeconds = 1

# Minimum number of blocks that fall together in a small cave-in.
# Permitted values: 1 - 512
smallMinClusterBlocks = 14

# Maximum number of blocks that fall together in a small cave-in.
# Permitted values: 1 - 512
smallMaxClusterBlocks = 17

# Horizontal distance in blocks from the epicentre of a small cave-in.
# Permitted values: 2 - 64
smallRadius = 16

# Distance in blocks above the epicentre that a small cave-in can reach. A large value lets the mod find the ceiling of a high cave.
# Permitted values: 2 - 128
smallHeightAbove = 24

# Distance in blocks below the epicentre that a small cave-in can reach.
# Permitted values: 0 - 64
smallDepthBelow = 4

# Small cave-in screen shake strength.
# Permitted values: 0.0 - 1.0
smallShakeIntensity = 0.2

# Number of seconds that the blocks of a small cave-in need to go back into the world. The blocks go back a few at a time across this time, so that no large group of blocks changes together.
# Permitted values: 1 - 600
smallSettleSeconds = 8

# Probability weight of a medium cave-in against the other sizes.
# Permitted values: 0 - 1000
mediumWeight = 0

# Number of seconds that a medium cave-in continues.
# Permitted values: 5 - 3600
mediumDurationSeconds = 90

# Number of seconds between two clusters of a medium cave-in.
# Permitted values: 1 - 600
mediumClusterIntervalSeconds = 1

# Minimum number of blocks that fall together in a medium cave-in.
# Permitted values: 1 - 512
mediumMinClusterBlocks = 18

# Maximum number of blocks that fall together in a medium cave-in.
# Permitted values: 1 - 512
mediumMaxClusterBlocks = 21

# Horizontal distance in blocks from the epicentre of a medium cave-in.
# Permitted values: 2 - 64
mediumRadius = 24

# Distance in blocks above the epicentre that a medium cave-in can reach. A large value lets the mod find the ceiling of a high cave.
# Permitted values: 2 - 128
mediumHeightAbove = 32

# Distance in blocks below the epicentre that a medium cave-in can reach.
# Permitted values: 0 - 64
mediumDepthBelow = 6

# Medium cave-in screen shake strength.
# Permitted values: 0.0 - 1.0
mediumShakeIntensity = 0.3

# Number of seconds that the blocks of a medium cave-in need to go back into the world. The blocks go back a few at a time across this time, so that no large group of blocks changes together.
# Permitted values: 1 - 600
mediumSettleSeconds = 15

# Probability weight of a large cave-in against the other sizes.
# Permitted values: 0 - 1000
largeWeight = 0

# Number of seconds that a large cave-in continues.
# Permitted values: 5 - 3600
largeDurationSeconds = 120

# Number of seconds between two clusters of a large cave-in.
# Permitted values: 1 - 600
largeClusterIntervalSeconds = 1

# Minimum number of blocks that fall together in a large cave-in.
# Permitted values: 1 - 512
largeMinClusterBlocks = 22

# Maximum number of blocks that fall together in a large cave-in.
# Permitted values: 1 - 512
largeMaxClusterBlocks = 35

# Horizontal distance in blocks from the epicentre of a large cave-in.
# Permitted values: 2 - 64
largeRadius = 32

# Distance in blocks above the epicentre that a large cave-in can reach. A large value lets the mod find the ceiling of a high cave.
# Permitted values: 2 - 128
largeHeightAbove = 48

# Distance in blocks below the epicentre that a large cave-in can reach.
# Permitted values: 0 - 64
largeDepthBelow = 8

# Large cave-in screen shake strength.
# Permitted values: 0.0 - 1.0
largeShakeIntensity = 0.4

# Number of seconds that the blocks of a large cave-in need to go back into the world. The blocks go back a few at a time across this time, so that no large group of blocks changes together.
# Permitted values: 1 - 600
largeSettleSeconds = 23

# Blocks that must never fall. Write the block ids with a comma between them.
# Permitted values: block ids, or empty
blacklistedBlocks = 

# More blocks that can fall. Write the block ids with a comma between them.
# Permitted values: block ids, or empty
whitelistedBlocks = 

