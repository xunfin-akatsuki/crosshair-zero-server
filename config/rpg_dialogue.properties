# RPG Dialogue

# example_content - switch on the bundled example: one talkative villager, a handful of
# overheard lines, and murmurs for raiders. Useful for seeing what the mod does, and for
# reading as a worked example; every file is in the mod jar under
# data/rpg_dialogue_example/.
#
# On by default, so the mod does something the moment it is installed. Turn it off for a
# modpack with its own dialogue - though you need not bother: the example's speaker binding
# sits at priority -1000, so any real content outranks it automatically.
example_content=true

# panel_texture - what the dialogue panel is drawn from. Only matters on a client, and takes
# effect on the next resource reload (F3+T).
#
#   auto       the inventory texture, so the panel matches your resource pack. If the pack's
#              inventory has nothing plain to cut a panel from, the mod's own texture instead.
#   inventory  always the inventory texture, even where it does not look right.
#   own        always the mod's own texture, which looks like vanilla's. A resource pack can
#              replace it with assets/rpg_dialogue/textures/gui/panel.png.
panel_texture=auto
