# 数据源配置
DataSource:
    # 要使用的数据库类型
    # 有效值: H2, SQLITE, MARIADB, MYSQL, POSTGRESQL
    backend: MYSQL
    # 启用数据库缓存系统，在BungeeCord环境或使用网站集成时应禁用
    caching: true
    # 是否尝试使用虚拟线程(Java 21+)进行数据库缓存加载？
    useVirtualThreadsCache: true
    # 数据库主机地址
    mySQLHost: 127.0.0.1
    # 数据库端口
    mySQLPort: '3306'
    # 替代Mysql的useSsl(仅限MariaDB)
    # - disable: 不使用SSL
    # - trust: 盲目信任(不验证)
    # - verify_ca: 加密，验证证书，但不验证主机名
    # - verify_full: 加密，验证证书和主机名
    MariaDbSslMode: disabled
    # 通过SSL连接到MySQL数据库
    # 如果使用MariaDB，请改用sslMode
    mySQLUseSSL: true
    # 验证服务器证书
    # 不建议将此选项设置为false
    # 只有在您完全了解风险的情况下才设置为false
    mySQLCheckServerCertificate: true
    # 授权客户端检索RSA服务器公钥
    # 高级选项，不了解请忽略
    # 如果使用MariaDB，请改用MariaDbSslMode
    mySQLAllowPublicKeyRetrieval: true
    # 连接MySQL数据库的用户名
    mySQLUsername: zeropoint_auth
    # 连接MySQL数据库的密码
    mySQLPassword: 'REDACTED'
    # 数据库名称，用于转换器或作为SQLITE数据库名称
    mySQLDatabase: authme
    # 数据库表名
    mySQLTablename: authme
    # 用于排序数据的ID列
    mySQLColumnId: id
    # 存储或检查玩家昵称的列
    mySQLColumnName: username
    # 存储玩家真实姓名的列
    mySQLRealName: realname
    # 存储玩家密码的列
    mySQLColumnPassword: REDACTED
    # 存储玩家密码盐值的列
    mySQLColumnSalt: ''
    # 存储玩家电子邮件的列
    mySQLColumnEmail: email
    # 存储玩家是否已登录的列
    mySQLColumnLogged: isLogged
    # 存储玩家是否有有效会话的列
    mySQLColumnHasSession: hasSession
    # 存储玩家TOTP密钥的列(用于双因素认证)
    mySQLtotpKey: totp
    # 存储玩家最后IP的列
    mySQLColumnIp: ip
    # 存储玩家最后登录时间的列
    mySQLColumnLastLogin: lastlogin
    # 存储注册日期的列
    mySQLColumnRegisterDate: regdate
    # 存储注册时IP地址的列
    mySQLColumnRegisterIp: regip
    # 存储玩家最后位置X坐标的列
    mySQLlastlocX: x
    # 存储玩家最后位置Y坐标的列
    mySQLlastlocY: y
    # 存储玩家最后位置Z坐标的列
    mySQLlastlocZ: z
    # 存储玩家最后位置世界名称的列
    mySQLlastlocWorld: world
    # 存储玩家最后位置偏航角的列
    mySQLlastlocYaw: yaw
    # 存储玩家最后位置俯仰角的列
    mySQLlastlocPitch: pitch
    # 存储玩家UUID的列(可选)
    mySQLPlayerUUID: ''
    # 覆盖数据库连接池的大小，默认=10
    poolSize: 10
    # 连接池中连接的最大生命周期，默认=1800秒
    # 应设置为比mysql服务器wait_timeout至少少30秒
    maxLifetime: 1800

# 外部面板选项
ExternalBoardOptions:
    # 存储玩家组的列
    mySQLColumnGroup: ''
    # -1表示禁用。如果您希望只有激活的玩家才能登录服务器，
    # 可以在此设置未激活用户的组号，需要某些论坛/CMS支持
    nonActivedUserGroup: -1
    # 其他需要放入用户名(区分大小写)的MySQL列
    mySQLOtherUsernameColumns: []
    # BCrypt需要的log2轮数(不了解请勿修改)
    bCryptLog2Round: 12
    # phpBB安装过程中定义的phpBB表前缀
    phpbbTablePrefix: phpbb_
    # phpBB激活组ID；2是phpBB定义的默认注册组
    phpbbActivatedGroupId: 2
    # IP Board安装过程中定义的IP Board表前缀
    IPBTablePrefix: ipb_
    # IP Board默认组ID；3是IP Board定义的默认注册组
    IPBActivatedGroupId: 3
    # Xenforo安装过程中定义的Xenforo表前缀
    XFTablePrefix: xf_
    # XenForo默认组ID；2是Xenforo定义的默认注册组
    XFActivatedGroupId: 2
    # WordPress安装过程中定义的WordPress前缀
    wordpressTablePrefix: wp_

# 第三方功能
3rdPartyFeature:
    compatibility:
        # 当未注册玩家按下Shift+F时是否执行/help命令？
        # 这可以保持与某些菜单插件的兼容性
        # 如果使用TrMenu，请不要启用此选项，因为TrMenu已实现此功能
        menuPlugins: false
    features:
        i18nMessages:
            # 根据客户端设置向玩家发送i18n消息，此选项将覆盖`settings.messagesLanguage`
            # (需要ProtocolLib)
            # 这不会影响AuthMe帮助命令的语言
            enabled: false
            # 将区域代码重定向到特定的AuthMe语言代码
            # Minecraft区域列表: https://minecraft.wiki/w/Language
            # AuthMe语言代码: https://github.com/HaHaWTH/AuthMeReReloaded/blob/master/docs/translations.md
            # 例如，如果想向使用鞑靼语(tt_ru)的玩家显示俄语消息，
            # 并向使用文言文(lzh)的玩家显示简体中文消息，则：
            # locale-code-redirect:
            # - 'tt_ru:ru'
            # - 'lzh:zhcn'
            locale-code-redirect: 
            - tt_ru:ru
            - lzh:zhcn
        # 是否让基岩版玩家自动登录？
        # (需要hookFloodgate为true且floodgate已加载)
        bedrockAutoLogin: false
        purgeData:
            # 是否在未注册玩家退出时清除数据？
            purgeOnQuit: false
            # 应删除哪个世界的玩家数据？(输入玩家首次登录时所在世界的*文件夹*名称)
            purgeWorldFolderName: world
    fixes:
        # 启用防止幽灵玩家的新功能？
        antiGhostPlayer: true
        # (仅MC1.13-)
        # 是否使用高级方法修复潜影盒崩溃错误？
        advancedShulkerFix: false
        loginLocationFix:
            # 是否修复玩家在传送门中登录时的位置？
            fixPortalStuck: false
            # 是否修复玩家在地下登录时的位置？
            fixGroundStuck: true

# 设置
settings:
    sessions:
        # 是否启用会话功能？
        # 如果启用，当玩家成功认证后，
        # 他的IP和昵称将被保存。
        # 下次玩家加入服务器时，如果他的IP
        # 与上次相同且未超时，他将不需要再次认证
        enabled: true
        # 会话应在多少分钟后过期？
        # 玩家的会话在超时或IP更改后结束
        timeout: 43200
    # 消息语言，可用语言:
    # https://github.com/AuthMe/AuthMeReloaded/blob/master/docs/translations.md
    # 例如: zhcn, en
    messagesLanguage: zhcn
    # 强制AuthMe挂钩到Vault而不是特定的权限处理系统
    forceVaultHook: false
    # 日志级别: INFO, FINE, DEBUG。使用INFO显示一般消息，
    # FINE显示一些额外的详细信息(如密码失败)，
    # DEBUG用于调试
    # 本次加固：FINE -> INFO，避免日志长期记录失败密码与玩家 IP
    logLevel: INFO
    # 默认情况下，我们在与数据库通信时调度异步任务。如果希望
    # 与数据库的典型通信同步进行，将此设置为false
    useAsyncTasks: true
    # 服务器名称，用于某些占位符
    serverName: 准星：零点
    restrictions:
        # 未认证玩家可以聊天吗？
        # 请注意此功能还会阻止下面列表中未列出的所有命令
        allowChat: false
        # 对未认证玩家隐藏聊天记录？
        hideChat: false
        # 未认证玩家允许的命令
        allowCommands: 
        - /login
        - /log
        - /l
        - /register
        - /reg
        - /email
        - /captcha
        - /2fa
        - /totp
        # 每个IP允许的最大注册数量
        # 值0表示无限数量！
        # 本次加固：0(无限) -> 5。注意隧道下同 IP 计数为全服合并，
        # 因此不能设得太小，否则会挡住正常新玩家注册
        maxRegPerIp: 5
        # 允许的最小用户名长度
        minNicknameLength: 3
        # 允许的最大用户名长度
        maxNicknameLength: 16
        # 启用此设置后，在线玩家不会因"从另一个位置登录"被踢出
        # 此设置将防止潜在的安全漏洞
        ForceSingleSession: true
        ForceSpawnLocOnJoin:
            # 如果启用，每个在"ForceSpawnLocOnJoin.worlds"列出的世界中生成的玩家
            # 将在成功认证后被传送到出生点。玩家的退出位置将被覆盖
            # 这与"teleportUnAuthedToSpawn"不同，后者在玩家加入时将其传送到出生点
            enabled: false
            # 需要强制出生位置的世界名称
            # 区分大小写！
            worlds: 
            - world
            - world_nether
            - world_the_end
        # 此选项将保存玩家的退出位置
        SaveQuitLocation: false
        # 要激活受限用户功能，您需要
        # 启用此选项并配置AllowedRestrictedUser字段
        AllowRestrictedUser: true
        # 受限用户功能将踢出下面列出的玩家
        # 如果他们不匹配定义的IP地址。名称不区分大小写
        # 可以使用*作为通配符(127.0.0.*)，或使用"regex:"前缀的正则表达式 regex:127\.0\.0\..*
        # 示例:
        #     AllowedRestrictedUser:
        #     - playername;127.0.0.1
        #     - playername;regex:127\.0\.0\..*
        AllowedRestrictedUser: 
        - server_land;127.0.0.1
        - server;127.0.0.1
        - bukkit;127.0.0.1
        - purpur;127.0.0.1
        - system;127.0.0.1
        - admin;127.0.0.1
        - md_5;127.0.0.1
        - administrator;127.0.0.1
        - notch;127.0.0.1
        - spigot;127.0.0.1
        - bukkitcraft;127.0.0.1
        - paperclip;127.0.0.1
        - papermc;127.0.0.1
        - spigotmc;127.0.0.1
        - root;127.0.0.1
        - console;127.0.0.1
        - authme;127.0.0.1
        - owner;127.0.0.1
        # 禁止尝试使用受限用户名登录的未知IP？
        banUnsafedIP: false
        # 是否立即踢出未注册玩家？
        kickNonRegistered: false
        # 密码错误时是否踢出玩家？
        kickOnWrongPassword: false
        # 是否将未登录玩家传送到出生点？
        # 认证后他们将传送回正常位置
        teleportUnAuthedToSpawn: false
        # 未注册玩家可以移动吗？
        allowMovement: false
        # 玩家在登录或注册失败多少秒后被踢出？设为0禁用
        timeout: 360
        # 玩家名称中允许字符的正则表达式模式
        allowedNicknameCharacters: '[a-zA-Z0-9_]*'
        # 未注册玩家可以移动多远？
        # 设为0表示无限半径
        allowedMovementRadius: 0
        # 是否在登录前保护玩家物品栏？需要ProtocolLib
        ProtectInventoryBeforeLogIn: true
        # 是否在登录前拒绝Tab补全功能？需要ProtocolLib
        DenyTabCompleteBeforeLogin: false
        # 玩家加入时是否显示他的其他账户？
        # 权限: /authme.admin.accounts
        displayOtherAccounts: false
        # 出生点优先级；值: authme, essentials, cmi, multiverse, default
        spawnPriority: authme,essentials,cmi,multiverse,default
        # 每个IP允许的最大登录次数
        maxLoginPerIp: 10
        # 每个IP允许的最大加入次数
        maxJoinPerIp: 10
        # 如果设置为true，AuthMe将永远不会传送玩家！
        noTeleport: false
        # 密码中允许字符的正则表达式语法。默认[!-~]允许所有可见ASCII
        # 字符，这是我们推荐的。参见 http://asciitable.com
        # 可以使用 https://regex101.com 测试您的正则表达式
        allowedPasswordCharacters: '[!-~]*'
        # 电子邮件中允许字符的正则表达式语法
        allowedEmailCharacters: ^([a-zA-Z0-9_.+-]+)@([a-zA-Z0-9-]+)\.([a-zA-Z]{2,})$
    GameMode:
        # 玩家加入时强制生存模式？
        ForceSurvivalMode: true
    unrestrictions:
        # 下面可以列出AuthMe将忽略的所有账户名称
        # 用于注册或登录。自行承担配置风险！！
        # 此选项增加了与BuildCraft和其他一些mod的兼容性
        # 不区分大小写！示例:
        # UnrestrictedName:
        # - 'npcPlayer'
        # - 'npcPlayer2'
        UnrestrictedName: []
        # 下面可以列出AuthMe将忽略的所有物品栏名称
        # 用于注册或登录。自行承担配置风险！！
        # 此选项增加了与某些mod的兼容性
        # 不区分大小写！示例:
        # UnrestrictedInventories:
        # - 'myCustomInventory1'
        # - 'myCustomInventory2'
        UnrestrictedInventories: []
        # 是否严格检查不受限的物品栏？(原始行为)
        StrictUnrestrictedInventoriesCheck: true
    security:
        # 密码最小长度
        minPasswordLength: 8
        # 密码最大长度
        passwordMaxLength: 26
        # 可能的值: SHA256, BCRYPT, BCRYPT2Y, PBKDF2, SALTEDSHA512,
        # MYBB, IPB3, PHPBB, PHPFUSION, SMF, XENFORO, XAUTH, JOOMLA, WBB3, WBB4, MD5VB,
        # PBKDF2DJANGO, WORDPRESS, ROYALAUTH, ARGON2, NOCRYPT, CUSTOM (仅限开发者)。完整列表见
        # https://github.com/AuthMe/AuthMeReloaded/blob/master/docs/hash_algorithms.md
        # 如果使用ARGON2，请确保系统上有argon2 c库
        passwordHash: SHA256
        # 如果密码检查失败，AuthMe还将尝试使用以下哈希方法检查
        # 当从一种哈希方法更改到另一种时使用此设置
        # AuthMe会将密码更新为新哈希。示例:
        # legacyHashes:
        # - 'SHA1'
        legacyHashes: []
        # SALTED2MD5 MD5(MD5(password)+salt)的盐长度
        doubleMD5SaltLength: 8
        # 如果passwordHash设置为PBKDF2，使用的轮数。默认为10000
        pbkdf2Rounds: 10000
        # 防止使用不安全密码；使用小写！
        # 由于可能的冲突，应始终将'help'设为unsafePassword
        # unsafePasswords:
        # - '123456'
        # - 'password'
        # - 'help'
        unsafePasswords: 
        - '12345678'
        - password
        - qwertyui
        - '123456789'
        - '87654321'
        - '1234567890'
        - asdfghjkl
        - zxcvbnm,
        - asdfghjk
        - '12312312'
        - '123123123'
        - '32132132'
        - '321321321'
    registration:
        # 在服务器上启用注册？
        enabled: true
        # 每X秒向玩家发送一次消息
        # 提醒他需要登录/注册
        messageInterval: 5
        # 只有注册并登录的玩家可以玩
        # 参见restrictions了解例外情况
        force: true
        # 注册类型: PASSWORD或EMAIL
        # PASSWORD = 用户提供密码注册账户；
        # EMAIL = 生成密码并发送到用户提供的电子邮件
        type: PASSWORD
        # /register命令的第二个参数应接受: 
        # NONE = 无第二个参数
        # CONFIRMATION = 必须重复第一个参数(密码或电子邮件)
        # EMAIL_OPTIONAL = 密码注册: 第二个参数可以为空或有电子邮件地址
        # EMAIL_MANDATORY = 密码注册: 第二个参数必须是电子邮件地址
        secondArg: CONFIRMATION
        email:
            # 当玩家未验证电子邮件时是否取消注册？
            # 仅在启用电子邮件注册时有效
            unregisterOnEmailVerificationFailure: false
            # 在多少分钟后取消注册未验证电子邮件的玩家？
            unregisterAfterMinutes: 10
        # 成功注册后是否强制踢出玩家？
        # 不要与下面的登录功能一起使用
        forceKickAfterRegister: false
        # AuthMe是否需要强制在成功注册后执行/login？
        forceLoginAfterRegister: false
    # 是否延迟加入消息并在玩家登录后显示？
    delayJoinMessage: true
    # 成功登录后发送的自定义加入消息，
    # 留空使用原始消息
    # 可用变量:
    # {PLAYERNAME}: 玩家名称(无颜色)
    # {DISPLAYNAME}: 玩家显示名称(有颜色)
    # {DISPLAYNAMENOCOLOR}: 玩家显示名称(无颜色)
    customJoinMessage: ''
    # 是否删除未登录用户的退出消息？
    removeUnloggedLeaveMessage: true
    # 是否完全删除加入消息？
    removeJoinMessage: true
    # 是否完全删除退出消息？
    removeLeaveMessage: true
    # 是否在登录/注册前添加失明药水效果？
    applyBlindEffect: false
    # 是否防止人们使用其他大小写登录？
    # 如果注册了Xephi，那么Xephi可以登录，但不能是XEPHI/xephi/XePhI
    preventOtherCase: true

# 组选项
GroupOptions:
    # 在玩家登录前启用将其切换到定义的权限组
    enablePermissionCheck: false
    # 这是一个非常重要的选项：如果已注册玩家加入服务器
    # AuthMe将把他切换到unLoggedInGroup。这应该可以防止所有主要漏洞
    # 您可以设置权限插件为此特殊组设置无权限，
    # 或只有聊天权限(或发送私信等权限)
    # 更好的方法是为此组设置少量权限，因此如果玩家
    # 尝试利用账户，他们只能执行您为该组定义的操作
    # 登录后，玩家将被移动到正确的权限组！
    # 请注意组名区分大小写，因此'admin'与'Admin'不同
    # 否则您的组将被清除，玩家将以默认组[]加入！
    # 示例: registeredPlayerGroup: 'NotLogged'
    registeredPlayerGroup: ''
    # 类似于上面，未注册玩家可以设置为以下权限组
    unregisteredPlayerGroup: ''

# 电子邮件设置
Email:
    # 电子邮件SMTP服务器主机
    mailSMTP: smtp.163.com
    # 电子邮件SMTP服务器端口
    mailPort: 465
    # 仅影响端口25：启用TLS/STARTTLS？
    useTls: true
    # 发送邮件的电子邮件账户
    mailAccount: ''
    # 电子邮件账户密码
    mailPassword: ''
    # 电子邮件地址，当mailAccount不是账户的电子邮件地址时填写
    mailAddress: ''
    # 自定义发件人名称，替换电子邮件中mailAccount名称
    mailSenderName: ''
    # 恢复密码长度
    RecoveryPasswordLength: 12
    # 邮件主题
    mailSubject: 您的新AuthMe密码
    # 类似于maxRegPerIP但是针对电子邮件
    maxRegPerEmail: 1
    # 提醒玩家添加电子邮件？
    recallPlayers: false
    # 提醒调度程序的延迟(分钟)
    delayRecall: 5
    # 将新密码绘制在图像中发送？
    generateImage: false
    # OAuth2令牌
    emailOauth2Token: ''
    # 服务器关闭时发送电子邮件通知
    shutDownEmail: false
    # 服务器关闭时发送电子邮件通知的地址
    shutDownEmailAddress: your@mail.com

# 钩子设置
Hooks:
    # 是否需要与multiverse挂钩以检查出生点？
    multiverse: true
    # 是否需要与PlaceholderAPI挂钩以使用AuthMe占位符？
    placeholderapi: true
    # 是否需要与BungeeCord挂钩？
    bungeecord: false
    # 是否需要与Velocity挂钩？
    velocity: false
    # 在发送登录信息到代理前等待多少tick？
    # 如果玩家延迟高，请增加此值
    proxySendDelay: 50
    # 挂钩到floodgate
    # 如果想使用其他基岩功能，必须为true
    floodgate: false
    # 允许基岩玩家加入而不检查isValidName？
    ignoreBedrockNameCheck: true
    # 注册/登录后将玩家发送到此BungeeCord服务器
    sendPlayerTo: ''
    # 是否需要在加入时禁用Essentials SocialSpy？
    disableSocialSpy: false
    # 是否需要在加入时强制执行/motd Essentials命令？
    useEssentialsMotd: false

# 保护设置
Protection:
    # 启用一些服务器保护(基于国家的登录，反机器人)
    enableProtection: false
    # 也将保护应用于已注册用户名
    enableProtectionRegistered: true
    # 允许加入服务器和注册的国家。国家代码见
    # https://dev.maxmind.com/geoip/legacy/codes/iso3166/
    # 使用"LOCALHOST"表示本地地址
    countries: 
    - LOCALHOST
    # 不允许加入服务器和注册的国家
    countriesBlacklist: 
    - A1
    # 是否需要启用自动反机器人系统？
    enableAntiBot: true
    # 间隔秒数
    antiBotInterval: 5
    # 在反机器人系统自动启用前允许登录的最大玩家数
    antiBotSensibility: 10
    # 反机器人自动系统的持续时间(分钟)
    antiBotDuration: 10
    # 反机器人激活前的延迟(秒)
    antiBotDelay: 60
    quickCommands:
        # 在加入过程后的定义时间(毫秒)前拒绝玩家发出的命令
        denyCommandsBeforeMilliseconds: 1000

# 清理设置
Purge:
    # 如果启用，AuthMe自动清理旧的未使用账户
    useAutoPurge: false
    # 账户应被清理前的天数
    daysBeforeRemovePlayer: 60
    # 清理过程中是否需要删除player.dat文件？
    removePlayerDat: false
    # 清理过程中是否需要删除Essentials/userdata/player.yml文件？
    removeEssentialsFile: false
    # 存储players.dat的世界
    defaultWorld: world
    # 清理时删除LimitedCreative/inventories/player.yml, player_creative.yml文件？
    removeLimitedCreativesInventories: false
    # 清理过程中是否需要删除AntiXRayData/PlayerData/player文件？
    removeAntiXRayFile: false
    # 是否需要删除权限？
    removePermissions: false

# 安全设置
Security:
    SQLProblem:
        # 如果无法联系SQL数据库，是否停止服务器？
        # 注意：如果设置为false，
        # AuthMe将自动禁用且服务器将不受保护！
        # 本次加固：false -> true。否则数据库一旦失联 AuthMe 会静默禁用、
        # 服务器转为「无保护」状态
        stopServer: true
    console:
        # 是否将AuthMe日志输出复制到单独的文件中？
        logConsole: true
    account:
        haveIBeenPwned:
            # 使用密码的哈希版本查询haveibeenpwned.com
            # 用于检查是否安全
            # 本次加固：开启已泄露密码库检测（仅按密码哈希查询，与 IP 无关，安全）
            check: true
            # 如果密码使用次数超过此数字，则视为不安全
            limit: 0
        emailVerification:
            # 如果启用电子邮件功能，更改密码时是否需要电子邮件验证？
            required: true
    captcha:
        # 当玩家使用错误密码太多次时启用验证码
        # 本次加固：开启反撞库验证码（只弹验证码，不封禁，隧道环境下安全）
        useCaptcha: true
        # 需要验证码前的最大尝试次数
        # 本次加固：8 -> 5，更早触发验证码
        maxLoginTry: 5
        # 验证码长度
        captchaLength: 6
        # 重置玩家登录尝试计数的分钟数
        captchaCountReset: 120
        # 玩家注册前是否需要验证码？
        requireForRegistration: false
    tempban:
        # 如果用户输入错误密码太多次，临时封禁其IP地址
        # 本次加固：保持关闭。SakuraFrp 隧道下所有玩家都是 127.0.0.1，
        # 一旦开启按 IP 封禁会封掉全服玩家，必须关闭！
        enableTempban: false
        # 用户IP被临时封禁前的登录尝试次数
        maxLoginTries: 8
        # IP地址被临时封禁的时间长度(分钟)
        # 默认: 480分钟(8小时)
        tempbanLength: 480
        # 重置IP和用户名失败登录计数的分钟数
        # 默认: 480分钟(8小时)
        minutesBeforeCounterReset: 480
        # 替代使用内部封禁系统执行的命令，空则禁用
        # 可用占位符: %player%, %ip%
        customCommand: ''
    recoveryCode:
        # 恢复代码应具有的字符数(0禁用)
        length: 8
        # 恢复代码有效多少小时？
        validForHours: 6
        # 输入恢复代码的最大尝试次数
        maxTries: 4
        # 玩家在密码恢复后有多少时间可以更改密码
        # 无需登录。以分钟为单位
        # 默认: 2分钟
        passwordChangeTimeout: 5
    emailRecovery:
        # 用户必须等待多少秒才能再次发送密码恢复邮件？
        # 这可以防止攻击者滥用AuthMe的电子邮件功能
        cooldown: 60
    privacy:
        # 使用/email show显示的邮件将部分隐藏
        # 例如(如果启用)
        #  原始邮件: my.email@example.com
        #  隐藏邮件: my.***@***mple.com
        enableEmailMasking: false
        # 验证码将在多少分钟后过期
        verificationCodeExpiration: 10

# 插件设置
Plugin:
    updates:
        # 从GitHub检查更新？
        checkForUpdates: true
    banners:
        # 启动时是否显示AuthMe横幅？
        showBanners: true

# 在用户登录前，各种属性会暂时从玩家中移除，
# 如OP状态、飞行能力和行走/飞行速度
# 一旦用户登录，我们会添加回之前保存的属性
# 在此部分，您可以定义应如何处理这些属性
limbo:
    persistence:
        # 除了将数据存储在内存中，您还可以定义数据应如何持久化
        # 到磁盘。这在服务器崩溃时很有用，因此下次服务器启动时我们可以
        # 正确恢复如OP状态、飞行能力和行走/飞行速度等
        # DISABLED: 无磁盘存储,
        # INDIVIDUAL_FILES: 每个玩家数据在自己的文件中,
        # DISTRIBUTED_FILES: 根据UUID将玩家分配到不同文件中
        type: INDIVIDUAL_FILES
        # 此设置仅影响DISTRIBUTED_FILES持久化
        distributionSize: SIXTEEN
    # 是否允许玩家飞行: RESTORE, ENABLE, DISABLE, NOTHING
    restoreAllowFlight: RESTORE
    # 恢复飞行速度: RESTORE, DEFAULT, MAX_RESTORE, RESTORE_NO_ZERO
    restoreFlySpeed: RESTORE_NO_ZERO
    # 恢复行走速度: RESTORE, DEFAULT, MAX_RESTORE, RESTORE_NO_ZERO
    restoreWalkSpeed: RESTORE_NO_ZERO

# 备份系统
BackupSystem:
    # 备份的一般配置：如果为false，则无法备份
    ActivateBackup: false
    # 每次服务器启动时创建备份
    OnServerStart: false
    # 每次服务器停止时创建备份
    OnServerStop: true
    # 仅Windows: MySQL安装路径
    MysqlWindowsPath: C:\Program Files\MySQL\MySQL Server 5.1\

# 转换器设置
Converter:
    CrazyLogin:
        # CrazyLogin数据库文件名
        fileName: accounts.db
    loginSecurity:
        # LoginSecurity: 从SQLite转换；如果false则使用MySQL
        useSqlite: true
        mySql:
            # LoginSecurity MySQL: 数据库主机
            host: ''
            # LoginSecurity MySQL: 数据库名称
            database: ''
            # LoginSecurity MySQL: 数据库用户
            user: ''
            # LoginSecurity MySQL: 数据库用户密码
            password: ''