#总开关
[master_switches]
	#流浪女仆功能总开关。关闭后不再自动生成流浪女仆，但响应 /tlm_wandering_maid wanderingmaid spawn 指令；已经存在的流浪女仆不受影响，会继续按原状态机运行，仍然可以正常交互与收留。
	wanderingMaidEnabled = true
	#流浪商人女仆交易功能总开关。关闭后不再生成待售女仆、不添加交易物品、不显示交易女仆按钮；已经存在的待售女仆和已注入的交易物品不受影响，仍然可以正常交易。
	wanderingTraderMaidTradeEnabled = true

#流浪女仆事件配置
[wandering_maid]
	#新玩家默认是否开启流浪女仆事件。玩家可以在游戏内的流浪女仆之书中单独修改。
	defaultEnabled = true
	#每隔多少分钟尝试触发一次流浪女仆事件（范围 0~60 分钟；0 表示关闭自动触发，指令触发不受影响）
	# Default: 20
	# Range: 0 ~ 60
	spawnIntervalMinutes = 20
	#每次到达触发时间后，实际生成流浪女仆事件的概率（范围 0%~100%）。每名玩家独立判定。
	# Default: 5
	# Range: 0 ~ 100
	spawnChancePercent = 5
	#每名玩家在一次流浪事件中生成的女仆数量（范围 1~10）
	# Default: 1
	# Range: 1 ~ 10
	maidsPerPlayer = 1
	#全服同时存在的流浪女仆上限（范围 1~1024）。达到上限后自动事件不再生成；指令 /tlm_wandering_maid wanderingmaid spawn 不受此限制。
	# Default: 12
	# Range: 1 ~ 1024
	maxAliveMaids = 12
	#兼容旧配置；被拒绝或忽略的流浪女仆现在始终自动清除，不再允许长期保留。
	rejectedCleanupEnabled = true
	#被拒绝后最多保留30秒再清除；可设置更短延迟（0 表示立即清除）。
	# Default: 30
	# Range: 0 ~ 600
	rejectedCleanupDelaySeconds = 30
	#流浪女仆死亡掉落与收留赠礼的物品黑名单。填写完整物品 ID，例如 minecraft:bedrock；可无限添加，黑名单优先于白名单
	dropBlacklist = []
	#流浪女仆死亡掉落与收留赠礼的物品白名单。留空时允许所有非黑名单物品；填写后只会随机其中的物品，例如 minecraft:diamond
	dropWhitelist = []

#流浪商人女仆交易配置
[wandering_trader_maid_trade]
	#流浪商人出现时，附带待售女仆的权重。范围 0~100；0 表示不再生成待售女仆（但保留交易界面）。总开关关闭时此项无效。
	# Default: 15
	# Range: 0 ~ 100
	stockWeight = 15
	#待售女仆的最低绿宝石价格（范围 1~999）
	# Default: 192
	# Range: 1 ~ 999
	priceMin = 192
	#待售女仆的最高绿宝石价格（范围 1~999，需不低于最低价格）
	# Default: 320
	# Range: 1 ~ 999
	priceMax = 320
	#流浪商人死亡时，绑定的待售女仆是否恢复自由身（不死亡）。true：女仆存活，解除交易标记，变成无主自由女仆；false：维持原行为，女仆被直接删除。注意：流浪商人只是离开（未死亡）时，无论此项如何设置，女仆都会被删除。
	freeMaidOnTraderDeath = true
	#兼容旧配置；每个商人现在最多出售一名女仆，不会补货。
	# Default: 0
	# Range: 0 ~ 99
	restockTimes = 0

	#车万女仆给予物品配置
	[wandering_trader_maid_trade.wandering_give_things_config]
		#卖出女仆后给予的主要奖励物品 ID，格式为 命名空间:路径，例如 touhou_little_maid:favorability_tool_full。留空或填写无效 ID 时不会发放该物品。
		sellRewardMainItem = "touhou_little_maid:favorability_tool_full"
		#主要奖励物品的数量（范围 1~64）
		# Default: 1
		# Range: 1 ~ 64
		sellRewardMainCount = 1
		#主要奖励物品是否仅在玩家背包中没有时发放。true：背包已有则不重复给；false：每次卖出都给。
		sellRewardMainOnlyIfMissing = true
		#卖出女仆后额外给予的物品列表。每项格式为 物品ID;最少数量;最多数量
		#数量区间为闭区间，min/max 写反会自动交换；min 和 max 都为 0 时该项不发放。
		#Extra items granted on maid sale. Format: ItemID;minAmount;maxAmount.
		#Inclusive range; reversed min/max auto-swap; both 0 = item skipped.
		#Invalid item IDs skip that entry only.
		sellRewardExtraItems = ["minecraft:netherite_ingot;1;3", "minecraft:enchanted_golden_apple;3;8"]
